<h1 style="margin: 0; font-size: 32px; font-weight: 800; letter-spacing: -0.02em">Sign in</h1>
<p style="margin: 8px 0 28px; font-size: 16px; color: #3E424B">New here? This makes your account too.</p>

<p style="margin: 18px 0 0; font-size: 14px; line-height: 1.5; color: #3E424B">The link works once, for 15 minutes. No passwords.</p>
</div>
<p style="margin: 28px 0 0; font-size: 14px; color: #5D6472">By signing in you agree to the <a href="#" style="color: #3E424B">terms</a>. We never send your workflows to a model.</p>
