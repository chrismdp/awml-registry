<div style="display: flex; flex-wrap: wrap; align-items: center; gap: 28px">

</div>
<a href="SignIn.dc.html" style="color: #FFFFFF; background: #16171B; text-decoration: none; font-weight: 600; font-size: 15px; padding: 11px 20px; border-radius: 999px; min-height: 44px; box-sizing: border-box; display: inline-flex; align-items: center">Sign in</a>
</header>

<section style="padding: 72px 0 40px; display: flex; flex-wrap: wrap; gap: 24px; justify-content: space-between; align-items: end">
<div style="flex: 1 1 520px; min-width: 0">
<h1 style="margin: 0; font-size: 56px; line-height: 1.05; font-weight: 800; letter-spacing: -0.035em">Public workflows</h1>
<p style="margin: 14px 0 0; font-size: 19px; color: #3E424B">Workflows people have drawn and shared. Borrow one and make it yours.</p>
</div>
<form style="flex: 0 1 420px; min-width: 0; display: flex; gap: 8px">
<label for="g-search" style="position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0)">Search by title</label>
<input id="g-search" type="search" placeholder="Search by title" style="flex: 1 1 auto; min-width: 0; height: 48px; padding: 0 18px; border-radius: 999px; border: 2px solid #16171B; font: inherit; font-size: 16px">
<button type="submit" style="height: 48px; padding: 0 20px; border-radius: 999px; border: none; background: #16171B; color: #FFFFFF; font: inherit; font-weight: 600; font-size: 16px">Search</button>
</form>
</section>

<section style="display: grid; grid-template-columns: repeat(auto-fill, minmax(270px, 1fr)); gap: 20px; padding-bottom: 80px">
<sc-for list="{{cards}}" as="c" hint-placeholder-count="8">
<a href="Workflow.dc.html" style="display: flex; flex-direction: column; border-radius: 22px; background: #F6F7F9; color: #16171B; text-decoration: none; overflow: hidden">
<div style="height: 200px; padding: 20px; box-sizing: border-box; display: flex; align-items: center; justify-content: center"><img src="{{c.img}}" alt="" style="max-width: 100%; max-height: 100%; object-fit: contain"></div>
<div style="padding: 18px 20px 22px; background: #FFFFFF; margin: 0 6px 6px; border-radius: 18px; display: flex; flex-direction: column; gap: 10px">
<div style="font-weight: 700; font-size: 17px; line-height: 1.3">{{c.title}}</div>
<div style="display: flex; flex-wrap: wrap; gap: 6px; font-size: 13px; font-weight: 600">
<span style="background: #CDD3FB; box-shadow: inset 0 0 0 1.5px #3B4BB0; border-radius: 999px; padding: 3px 10px">AI {{c.ai}}</span>
<span style="background: #C4E3D1; box-shadow: inset 0 0 0 1.5px #2B7A4F; border-radius: 999px; padding: 3px 10px">Code {{c.code}}</span>
<span style="background: #F7D79A; box-shadow: inset 0 0 0 1.5px #9A6100; border-radius: 999px; padding: 3px 10px">Person {{c.person}}</span>
</div>
<div style="font-family: 'DM Mono', monospace; font-size: 13px; color: #5D6472">examples / {{c.slug}}</div>
</div>
</a>
</sc-for>
</section>

</div>
</div>
