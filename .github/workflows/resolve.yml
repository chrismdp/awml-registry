# The factory's rebase, drawn in .github/drawings/rebase-conflicting-pull-requests.yaml (A pull
# request that conflicts with main is rebased onto it). When a commit lands on main, each open pull
# request that GitHub marks as conflicting, from a branch of this repository opened by someone with
# write access to this repository, or the build's app, is rebased onto main. Main doesn't require
# branches to be up to date, so only a conflict needs this. A plain git rebase comes first, and a clean one is pushed at once with no
# Claude session. Claude starts only on a real conflict, resolves it with a read-only token and hands
# back the rebased branch. It runs no checks of its own: the app's push starts CI, whose reviews run
# on the pushed commit, since a resolution is new code. When it ends, one new comment on each pull
# request says what was pushed, or why it couldn't be.
#
# The find job finds the conflicting pull requests and rebases each with git alone, hooks and
# fsmonitor off, running nothing from the branch. A branch whose commits change .github/ or Claude
# Code's own files isn't rebased at all, since the app doesn't push it, and nor is one that changes
# its dependencies or npm's settings, since npm would install them beside the Claude token and runs
# a git dependency's prepare script even with scripts off, or the engine's pin, since the sessions'
# engine is built from main's: its comment says so. The draft job resolves each real conflict in a
# Claude session of its own. The push job runs on a fresh runner, shares none of the draft's access
# and runs nothing from the branch: it keeps the git-only guards, that the branch sits on main with
# no conflict markers and changes nothing in .github/ or Claude Code's own files, and force-pushes
# only if the branch hasn't moved since the find job saw it. The old commit stays on GitHub and the
# comment names it, so the replacement can be undone with one push.
#
# The rebased branches pass between jobs as artifacts of this run only, because the job split keeps
# the app's token away from the branch. The job that made each gives its sha256 as an output, and
# the push job checks it before it reads anything.
#
# Before it works, a repository needs the GitHub App, its two secrets and the
# CLAUDE_CODE_OAUTH_TOKEN secret that build.yml lists.
name: Rebase conflicting pull requests

on:
  push:
    branches: [main]

concurrency:
  group: resolve-main
  cancel-in-progress: true

env:
  MAIN_SHA: ${{ github.sha }}

# Named, so GitHub runs each step's script with bash -eo pipefail, not bash -e alone, and a failure
# inside a pipe fails the step.
defaults:
  run:
    shell: bash

jobs:
  find:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
      pull-requests: read
    outputs:
      pulls: ${{ steps.find.outputs.pulls }}
      conflicted: ${{ steps.find.outputs.conflicted }}
      digest: ${{ steps.find.outputs.digest }}
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          persist-credentials: false

      # A pull request is the build's when a bot opened it from a build/issue- branch in this
      # repository. A fork's, or one a stranger opened between two branches here, is never touched.
      # Each rebase runs in a worktree of its own as the app's bot, so the factory's branches stay
      # the factory's own commits.
      - name: Find the conflicting pull requests and rebase each with git alone
        id: find
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          # Whether GitHub says someone may write to the repository: their role or its base permission is
          # exactly admin, maintain or write, so a custom role counts only by what it grants.
          may_write() {
            [[ "$1" =~ ^[A-Za-z0-9-]{1,39}$ ]] || return 1
            local role="" permission=""
            IFS=$'\t' read -r role permission < <(gh api "repos/$GITHUB_REPOSITORY/collaborators/$1/permission" --jq '[.role_name // "", .permission // ""] | @tsv' || true) || true
            case "$role" in admin|maintain|write) return 0 ;; esac
            case "$permission" in admin|maintain|write) return 0 ;; esac
            return 1
          }
          rebased="$RUNNER_TEMP/rebased"
          mkdir -p "$rebased"
          bot_id="$(gh api "users/awml-factory%5Bbot%5D" --jq .id)"
          case "$bot_id" in ''|*[!0-9]*) echo "The app's bot has no id: $bot_id"; exit 1 ;; esac
          safe=(-c core.hooksPath=/dev/null -c core.fsmonitor=false -c user.name='awml-factory[bot]'
            -c user.email="$bot_id+awml-factory[bot]@users.noreply.github.com")
          auth="AUTHORIZATION: basic $(printf 'x-access-token:%s' "$GH_TOKEN" | base64 -w0)"
          pulls='[]'
          conflicted=false
          while read -r number; do
            case "$number" in ''|*[!0-9]*) continue ;; esac
            mergeable=UNKNOWN
            head_sha=
            for _ in 1 2 3 4 5; do
              details="$(gh pr view "$number" --repo "$GITHUB_REPOSITORY" --json mergeable,headRefOid)"
              mergeable="$(jq -r '.mergeable' <<< "$details")"
              head_sha="$(jq -r '.headRefOid' <<< "$details")"
              [ "$mergeable" != UNKNOWN ] && break
              sleep 2
            done
            [ "$mergeable" = CONFLICTING ] || continue
            [[ "$head_sha" =~ ^[0-9a-f]{40}$ ]] || continue

            pull="$(gh api "repos/$GITHUB_REPOSITORY/pulls/$number")"
            jq -e --arg repository "$GITHUB_REPOSITORY" \
              '.base.ref == "main" and .head.repo.full_name == $repository and .head.ref != "factory-media"' \
              <<< "$pull" > /dev/null || continue
            # The factory's own pull requests, by the app's exact login and type on a build/issue-
            # branch, and those of anyone GitHub says may write to the repository, not how they're
            # associated with it.
            if ! jq -e '.user.login == "awml-factory[bot]" and .user.type == "Bot" and (.head.ref | startswith("build/issue-"))' \
              <<< "$pull" > /dev/null; then
              login="$(jq -r '.user.login' <<< "$pull")"
              may_write "$login" || continue
            fi
            branch="$(jq -r '.head.ref' <<< "$pull")"
            [[ "$branch" =~ ^[A-Za-z0-9._/-]{1,200}$ ]] || continue

            git "${safe[@]}" -c http.https://github.com/.extraheader="$auth" fetch -q --no-tags origin "$head_sha"
            guarded='^\.github/|(^|/)\.claude(/|$)|(^|/)\.mcp\.json$|(^|/)CLAUDE(\.local)?\.md$|(^|/)\.npmrc$|(^|/)\.yarnrc[^/]*$|(^|/)node_modules(/|$)|(^|/)npm-shrinkwrap\.json$|(^|/)yarn\.lock$|(^|/)package(-lock)?\.json$|^vendor/awml/'
            # Every commit's files, not the net change: each commit is installed as the rebase replays
            # it, so one that adds a dependency and a later one that takes it out still count. The names
            # go to a file that grep reads whole, with no pipe for it to cut short.
            git "${safe[@]}" log --no-renames --name-only -z --format= "$(git merge-base "$MAIN_SHA" "$head_sha")..$head_sha" \
              > "$RUNNER_TEMP/names-$number"
            if grep -qzE "$guarded" "$RUNNER_TEMP/names-$number"; then
              pulls="$(jq -c --argjson number "$number" --arg branch "$branch" --arg head_sha "$head_sha" \
                '. + [{number: $number, branch: $branch, head_sha: $head_sha, clean: false, guarded: true}]' <<< "$pulls")"
              continue
            fi
            worktree="$RUNNER_TEMP/rebase-$number"
            git "${safe[@]}" worktree add -q --detach "$worktree" "$head_sha"
            clean=false
            if git -C "$worktree" "${safe[@]}" rebase -q "$MAIN_SHA" > /dev/null 2>&1; then
              clean=true
              git -C "$worktree" "${safe[@]}" bundle create -q "$rebased/$number.bundle" "$MAIN_SHA..HEAD"
            else
              git -C "$worktree" "${safe[@]}" rebase --abort || true
              conflicted=true
            fi
            pulls="$(jq -c --argjson number "$number" --arg branch "$branch" --arg head_sha "$head_sha" \
              --argjson clean "$clean" '. + [{number: $number, branch: $branch, head_sha: $head_sha, clean: $clean, guarded: false}]' <<< "$pulls")"
          done < <(gh api --paginate "repos/$GITHUB_REPOSITORY/pulls?state=open&per_page=100" --jq '.[].number')

          digest() { (cd "$1" && find . -type f -print0 | LC_ALL=C sort -z | xargs -0 -r sha256sum) | sha256sum | cut -c 1-64; }
          {
            echo "pulls=$pulls"
            echo "conflicted=$conflicted"
            echo "digest=$(digest "$rebased")"
          } | tee -a "$GITHUB_OUTPUT"

      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: rebased
          path: ${{ runner.temp }}/rebased
          if-no-files-found: ignore

  # Resolves each real conflict, with a read-only token. Each pull request gets a folder of its own
  # under $RUNNER_TEMP/pr, made before any session starts: a clone of the branch outside the
  # workspace, its rebase started there, its inputs, made read-only, and its sessions' output;
  # what the host reads after a session is kept in the host-only folder instead. A
  # session only edits the conflicted files and writes its note; Claude Code's scrub denies its
  # commands writes to scripts/, package.json and the lockfile, so git, which writes them when it
  # replays a commit, never runs in a session. Between sessions a step that holds no Claude token
  # adds what was resolved and continues each rebase with git, and a commit that conflicts in turn
  # waits for the next round's session: three rounds in all, so a rebase that conflicts on more
  # commits than that is left for a person. A last token-free step bundles each finished rebase,
  # reads it into a fresh repository and checks it, and gives the digest of what it keeps as the
  # job's output.
  draft:
    needs: find
    if: needs.find.outputs.conflicted == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 120
    permissions:
      contents: read
      pull-requests: read
    outputs:
      digest: ${{ steps.check.outputs.digest }}
    env:
      HOST_DIR: /var/lib/awml-host
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          persist-credentials: false
      # Only for Claude Code, and for npm before the sessions. No npm cache is saved or restored.
      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5.0.0
        with:
          node-version: 22
          package-manager-cache: false

      # A session may rename any folder it can reach under the runner's home and build a fake tree in
      # its place, which a denial, a bind mount of the old path, doesn't stop. /var/lib is root's, so
      # nothing running as the runner's user can rename the host-only folder made here, which holds
      # all the host reads after a session apart from the session's checked output and the trees it
      # checks by device and inode, and which every session's sandbox denies.
      - name: Make the host-only folder
        run: sudo install -d -o "$(id -u)" -g "$(id -g)" -m 700 "$HOST_DIR"

      # A session that checks or draws a workflow needs the AWML engine, which npm ci --ignore-scripts
      # doesn't build. Main's copy of the build script builds it from main's pin, outside the sandbox
      # and before any session, never the tree's own script: it fetches AWML's source and the
      # pinned Go, and keeps the build only if each file has the SHA-256 the pin names.
      - name: Build the AWML engine from main's pin
        run: |
          # Main's engine build script and pin, for the engine every session needs, built below.
          mkdir -p "$HOST_DIR/engine/scripts" "$HOST_DIR/engine/vendor/awml"
          cp scripts/engine-build.sh scripts/engine-lib.sh scripts/engine-pin.mjs "$HOST_DIR/engine/scripts/"
          cp vendor/awml/version.json vendor/awml/awml.js "$HOST_DIR/engine/vendor/awml/"
          bash "$HOST_DIR/engine/scripts/engine-build.sh"

      # Main's prompt, scripts and AGENTS.md are copied out first. Each conflicting branch's head is
      # fetched into a local branch of the workspace, so its clone carries it and the check can read
      # it, and cloned with no hardlinks outside the workspace. The clone has no hooks, no fsmonitor
      # and no editor, and commits as the app's bot. Its dependencies are installed there, with npm's
      # config files and every package's scripts off, from npm's own registry: the find job held
      # back any branch that changes an .npmrc, a .yarnrc or node_modules/. Git runs here with hooks,
      # fsmonitor and global config off, before any session starts, and starts the rebase, which stops
      # at the first conflict. Each clone's git config and its and its .git's device and inode, and the
      # workspace's, are kept in the host-only folder's baseline, with the list of each clone's
      # conflicted files, for the git after it.
      - name: Prepare a clone of each conflicting branch, before any session starts
        id: prepare
        env:
          GH_TOKEN: ${{ github.token }}
          PULLS: ${{ needs.find.outputs.pulls }}
          npm_config_userconfig: ${{ runner.temp }}/npm/user.npmrc
          npm_config_globalconfig: ${{ runner.temp }}/npm/global.npmrc
          npm_config_registry: https://registry.npmjs.org/
          npm_config_ignore_scripts: "true"
        run: |
          # npm refuses to load one file as both its user and its global config, so each is an
          # empty file of its own.
          mkdir -p "$RUNNER_TEMP/npm"
          : > "$npm_config_userconfig"
          : > "$npm_config_globalconfig"
          stop="$(openssl rand -hex 16)"
          echo "::stop-commands::$stop"
          trap 'echo "::$stop::"' EXIT
          mkdir -p "$HOST_DIR/main" "$HOST_DIR/baseline" "$HOST_DIR/check" "$HOST_DIR/resolved"
          cp .github/resolve-prompt.md .github/claude-settings.sh .github/scan-tokens.sh .github/resolve-session.sh .github/resolve-continue.sh .github/check-lockfile.sh .github/check-out.sh .github/placeholders.sh .github/rebase-state.sh AGENTS.md "$HOST_DIR/main/"
          id="$(gh api "users/awml-factory%5Bbot%5D" --jq .id)"
          case "$id" in ''|*[!0-9]*) echo "The app's bot has no id: $id"; exit 1 ;; esac
          auth="AUTHORIZATION: basic $(printf 'x-access-token:%s' "$GH_TOKEN" | base64 -w0)"
          safe_git() { GIT_CONFIG_GLOBAL=/dev/null GIT_CONFIG_NOSYSTEM=1 GIT_NO_REPLACE_OBJECTS=1 command git -c core.hooksPath=/dev/null -c core.fsmonitor=false -c diff.external= "$@"; }
          : > "$HOST_DIR/pulls.tsv"
          while IFS=$'\t' read -r number head_sha; do
            case "$number" in ''|*[!0-9]*) continue ;; esac
            [[ "$head_sha" =~ ^[0-9a-f]{40}$ ]] || continue
            root="$RUNNER_TEMP/pr/$number"
            mkdir -p "$root/in" "$root/out"
            GIT_CONFIG_COUNT=1 GIT_CONFIG_KEY_0=http.https://github.com/.extraheader GIT_CONFIG_VALUE_0="$auth" \
              safe_git fetch -q --no-tags origin "$head_sha:refs/heads/factory-rebase-$number"
            safe_git clone -q --no-hardlinks --no-checkout "$GITHUB_WORKSPACE" "$root/work"
            safe_git -C "$root/work" switch -q --detach "$head_sha"
            safe_git -C "$root/work" config core.hooksPath /dev/null
            safe_git -C "$root/work" config core.fsmonitor false
            safe_git -C "$root/work" config core.editor true
            safe_git -C "$root/work" config user.name "awml-factory[bot]"
            safe_git -C "$root/work" config user.email "$id+awml-factory[bot]@users.noreply.github.com"
            base="$(safe_git merge-base "$head_sha" "$MAIN_SHA")"
            safe_git log --oneline "$base..$head_sha" > "$root/in/branch-log.txt"
            safe_git log --oneline "$base..$MAIN_SHA" > "$root/in/main-log.txt"
            cp "$HOST_DIR/main/AGENTS.md" "$root/in/"
            gh api "repos/$GITHUB_REPOSITORY/pulls/$number" --jq '"# " + .title + "\n\n" + (.body // "")' > "$root/in/pull-request.md"
            if safe_git -C "$root/work" rebase -q "$MAIN_SHA" > /dev/null 2>&1; then
              echo "#$number rebased cleanly here after all."
            fi
            safe_git -C "$root/work" diff --name-only --no-ext-diff --no-textconv --diff-filter=U > "$HOST_DIR/conflicted-$number.txt"
            # The rebase stopped at its conflict on top of main, and find held back any branch that
            # changes its dependencies, so this installs main's lockfile.
            bash "$HOST_DIR/main/check-lockfile.sh" "$root/work"
            (cd "$root/work" && npm ci --ignore-scripts --no-audit --no-fund)
            cp "$HOST_DIR/engine/vendor/awml/awml.wasm" "$HOST_DIR/engine/vendor/awml/wasm_exec.js" "$HOST_DIR/engine/vendor/awml/build.json" "$root/work/vendor/awml/"
            chmod -R a-w "$root/in"
            cp "$root/work/.git/config" "$HOST_DIR/baseline/git-config-$number"
            stat -c %d:%i "$root/work" "$root/work/.git" > "$HOST_DIR/baseline/clone-$number"
            bash "$HOST_DIR/main/placeholders.sh" record "$root/work" "$HOST_DIR/baseline/protected-$number"
            printf '%s\t%s\n' "$number" "$head_sha" >> "$HOST_DIR/pulls.tsv"
          done < <(jq -r '.[] | select(.clean == false and .guarded == false) | [.number, .head_sha] | @tsv' <<< "$PULLS")
          stat -c %d:%i "$GITHUB_WORKSPACE" "$GITHUB_WORKSPACE/.git" > "$HOST_DIR/baseline/workspace"
          # Which of the paths Claude Code protects each clone and the workspace hold, so the
          # placeholders it leaves at the rest can be taken away after the sessions.
          bash "$HOST_DIR/main/placeholders.sh" record "$GITHUB_WORKSPACE" "$HOST_DIR/baseline/protected-workspace"
          cp "$GITHUB_WORKSPACE/.git/config" "$HOST_DIR/baseline/workspace-git-config"

      # Claude Code runs its commands in a sandbox, bubblewrap with socat for its network, and refuses
      # to start without it. Ubuntu's runners restrict the user namespaces bubblewrap needs, so allow
      # them on this throwaway machine, and check bubblewrap works before Claude starts.
      - name: Install Claude Code and bubblewrap
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y bubblewrap socat
          sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0 || true
          bwrap --dev-bind / / --unshare-pid true
          # The runner user could start a privileged container through Docker's socket, from inside
          # the sandbox, so it's closed to them before any session starts.
          if [ -e /var/run/docker.sock ]; then sudo chmod 600 /var/run/docker.sock; fi
          # npm refuses to load one file as both its user and its global config, so each is an empty
          # file of its own.
          mkdir -p "$RUNNER_TEMP/npm"
          : > "$RUNNER_TEMP/npm/user.npmrc"
          : > "$RUNNER_TEMP/npm/global.npmrc"
          (cd "$RUNNER_TEMP" && npm_config_userconfig="$RUNNER_TEMP/npm/user.npmrc" npm_config_globalconfig="$RUNNER_TEMP/npm/global.npmrc" npm install -g @anthropic-ai/claude-code@2.1.312)

      # The branch's commits can steer each session, so a session only edits files and runs no git
      # that writes, and the step that holds its token runs no git at all. Between sessions a step
      # that holds no Claude token continues each rebase. The scripts are main's, copied out above.
      - name: Resolve the conflicts, round 1
        id: session1
        env:
          CLAUDE_CODE_OAUTH_TOKEN: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          CLAUDE_CODE_SUBPROCESS_ENV_SCRUB: "1"
        run: |
          { STEP_SCRIPT="$0" bash "$HOST_DIR/main/resolve-session.sh" 1; exit; }
      - name: Continue each rebase, round 1
        id: continue1
        if: ${{ !cancelled() }}
        env:
          GIT_CONFIG_GLOBAL: /dev/null
          GIT_CONFIG_NOSYSTEM: "1"
          GIT_NO_REPLACE_OBJECTS: "1"
        run: |
          bash "$HOST_DIR/main/resolve-continue.sh"

      - name: Resolve the conflicts, round 2
        id: session2
        env:
          CLAUDE_CODE_OAUTH_TOKEN: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          CLAUDE_CODE_SUBPROCESS_ENV_SCRUB: "1"
        run: |
          { STEP_SCRIPT="$0" bash "$HOST_DIR/main/resolve-session.sh" 2; exit; }
      - name: Continue each rebase, round 2
        id: continue2
        if: ${{ !cancelled() }}
        env:
          GIT_CONFIG_GLOBAL: /dev/null
          GIT_CONFIG_NOSYSTEM: "1"
          GIT_NO_REPLACE_OBJECTS: "1"
        run: |
          bash "$HOST_DIR/main/resolve-continue.sh"

      - name: Resolve the conflicts, round 3
        id: session3
        env:
          CLAUDE_CODE_OAUTH_TOKEN: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          CLAUDE_CODE_SUBPROCESS_ENV_SCRUB: "1"
        run: |
          { STEP_SCRIPT="$0" bash "$HOST_DIR/main/resolve-session.sh" 3; exit; }
      - name: Continue each rebase, round 3
        id: continue3
        if: ${{ !cancelled() }}
        env:
          GIT_CONFIG_GLOBAL: /dev/null
          GIT_CONFIG_NOSYSTEM: "1"
          GIT_NO_REPLACE_OBJECTS: "1"
        run: |
          bash "$HOST_DIR/main/resolve-continue.sh"

      # Each finished rebase is bundled from its clone, and the bundle read as data into a fresh
      # repository, whose config no session ever touched, with no global or system config, hooks,
      # fsmonitor or external diff, beside no login token. Only if the workspace and the clone are
      # the ones the sessions started beside and in, the clone's git config is as it was, no
      # repository is nested in it, its rebase finished and wasn't given up on, and the out folder
      # is reached through no symbolic link. Every commit since main is tested against the held-back
      # pattern, not only the net change, so a change added and then reverted still counts. It must sit on main, carry no conflict marker, and
      # change nothing the app never pushes. The lines its resolution adds, beyond those the branch
      # already added, and Claude's note, must carry nothing like a token. The digest of what's kept
      # is the job's output, which the push job checks it against.
      - name: Check each rebase, read into a fresh repository
        id: check
        if: ${{ !cancelled() }}
        env:
          MAIN_SHA: ${{ github.sha }}
          GIT_CONFIG_GLOBAL: /dev/null
          GIT_CONFIG_NOSYSTEM: "1"
          GIT_NO_REPLACE_OBJECTS: "1"
        run: |
          stop="$(openssl rand -hex 16)"
          echo "::stop-commands::$stop"
          trap 'echo "::$stop::"' EXIT
          safe_git() { GIT_CONFIG_GLOBAL=/dev/null GIT_CONFIG_NOSYSTEM=1 GIT_NO_REPLACE_OBJECTS=1 command git -c core.hooksPath=/dev/null -c core.fsmonitor=false -c diff.external= "$@"; }
          if ! stat -c %d:%i "$GITHUB_WORKSPACE" "$GITHUB_WORKSPACE/.git" | cmp -s - "$HOST_DIR/baseline/workspace"; then
            echo "The workspace or its .git isn't the one the sessions started beside, so nothing is read from it."
            exit 1
          fi
          # Every session leaves Claude Code's placeholders in the workspace too.
          bash "$HOST_DIR/main/placeholders.sh" clear "$GITHUB_WORKSPACE" "$HOST_DIR/baseline/protected-workspace"
          # No session is denied the workspace, whose .git holds the scrub's own mount points, so its
          # config, which git's fetch from it reads, must be as it was, and only commits are taken
          # from it, by their ids, never a branch a session could have moved.
          if ! cmp -s "$GITHUB_WORKSPACE/.git/config" "$HOST_DIR/baseline/workspace-git-config"; then
            echo "The workspace's git config changed during the sessions, so nothing is read from it."
            exit 1
          fi
          # Replace refs are ignored, by GIT_NO_REPLACE_OBJECTS, and a grafts file, which would
          # change the commits git reads, is refused, in the workspace and in each clone.
          if [ -e "$GITHUB_WORKSPACE/.git/info/grafts" ] || [ -L "$GITHUB_WORKSPACE/.git/info/grafts" ]; then
            echo "A session left a grafts file in the workspace's .git, so nothing is read from it."
            exit 1
          fi
          guarded='^\.github/|(^|/)\.claude(/|$)|(^|/)\.mcp\.json$|(^|/)CLAUDE(\.local)?\.md$|(^|/)\.npmrc$|(^|/)\.yarnrc[^/]*$|(^|/)node_modules(/|$)|(^|/)npm-shrinkwrap\.json$|(^|/)yarn\.lock$|(^|/)package(-lock)?\.json$|^vendor/awml/'
          resolved="$HOST_DIR/resolved"
          mkdir -p "$resolved" "$HOST_DIR/check"
          while IFS=$'\t' read -r number head_sha; do
            case "$number" in ''|*[!0-9]*) continue ;; esac
            [[ "$head_sha" =~ ^[0-9a-f]{40}$ ]] || continue
            out="$RUNNER_TEMP/pr/$number/out"
            if ! bash "$HOST_DIR/main/check-out.sh" "$out" "$RUNNER_TEMP/pr"; then
              echo "The out folder of #$number isn't plain files and folders where it should be, so nothing is read from it."
              continue
            fi
            work="$RUNNER_TEMP/pr/$number/work"
            if ! stat -c %d:%i "$work" "$work/.git" | cmp -s - "$HOST_DIR/baseline/clone-$number"; then
              echo "The clone of #$number or its .git isn't the one its session started in, so nothing is read from it."
              continue
            fi
            fresh="$HOST_DIR/check/$number"
            bundle="$HOST_DIR/check/$number.bundle"
            if [ -e "$HOST_DIR/baseline/gave-up-$number" ]; then
              echo "The rebase of #$number stopped short."
            elif [ -d "$work/.git/rebase-merge" ] || [ -d "$work/.git/rebase-apply" ]; then
              echo "The rebase of #$number still conflicted after three rounds."
            elif ! cmp -s "$work/.git/config" "$HOST_DIR/baseline/git-config-$number"; then
              echo "The clone of #$number has a changed git config, so no git runs there."
            elif [ -e "$work/.git/info/grafts" ] || [ -L "$work/.git/info/grafts" ]; then
              echo "The clone of #$number holds a grafts file, so no git runs there."
            elif [ -n "$(find "$work" -mindepth 2 -name .git -print -quit)" ]; then
              echo "The clone of #$number holds a nested repository, so no git runs there."
            else
              safe_git -C "$work" bundle create -q "$bundle" "$MAIN_SHA..HEAD" || true
            fi
            safe_git init -q "$fresh"
            safe_git -C "$fresh" fetch -q --no-tags "$GITHUB_WORKSPACE" "$MAIN_SHA" "$head_sha"
            if [ -f "$bundle" ] && [ ! -L "$bundle" ] &&
              safe_git -C "$fresh" bundle verify -q "$bundle" > /dev/null 2>&1 &&
              safe_git -C "$fresh" fetch -q "$bundle" "HEAD:refs/rebased" &&
              safe_git -C "$fresh" merge-base --is-ancestor "$MAIN_SHA" refs/rebased &&
              ! safe_git -C "$fresh" grep -qE '^(<<<<<<<|>>>>>>>)( |$)' refs/rebased -- &&
              safe_git -C "$fresh" log --format= --name-only --no-renames -z "$MAIN_SHA..refs/rebased" > "$HOST_DIR/check/$number.names" &&
              ! grep -qzE "$guarded" "$HOST_DIR/check/$number.names"; then
              base="$(safe_git -C "$fresh" merge-base "$head_sha" "$MAIN_SHA")"
              comm -23 <(safe_git -C "$fresh" diff --no-ext-diff --no-textconv "$MAIN_SHA" refs/rebased | LC_ALL=C grep -a '^+' | LC_ALL=C sort -u) \
                <(safe_git -C "$fresh" diff --no-ext-diff --no-textconv "$base" "$head_sha" | LC_ALL=C grep -a '^+' | LC_ALL=C sort -u) \
                > "$HOST_DIR/check/$number.added"
              if bash "$HOST_DIR/main/scan-tokens.sh" "$HOST_DIR/check/$number.added"; then
                cp "$bundle" "$resolved/$number.bundle"
              else
                echo "The resolution of #$number adds what looks like a token, so it isn't kept."
              fi
            else
              echo "The session on #$number left no rebase that sits on main without conflict markers or files the app never pushes."
            fi
            if [ -f "$out/message.md" ] && [ ! -L "$out/message.md" ]; then
              head -c 20000 "$out/message.md" > "$HOST_DIR/check/$number.md"
              if bash "$HOST_DIR/main/scan-tokens.sh" "$HOST_DIR/check/$number.md"; then
                cp "$HOST_DIR/check/$number.md" "$resolved/$number.md"
              fi
            fi
          done < "$HOST_DIR/pulls.tsv"
          digest() { (cd "$1" && find . -type f -print0 | LC_ALL=C sort -z | xargs -0 -r sha256sum) | sha256sum | cut -c 1-64; }
          echo "digest=$(digest "$resolved")" >> "$GITHUB_OUTPUT"

      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        if: ${{ !cancelled() }}
        with:
          name: resolved
          path: ${{ env.HOST_DIR }}/resolved
          if-no-files-found: ignore

  push:
    needs: [find, draft]
    if: ${{ !cancelled() && needs.find.result == 'success' && needs.find.outputs.pulls != '[]' }}
    strategy:
      fail-fast: false
      matrix:
        pull: ${{ fromJSON(needs.find.outputs.pulls) }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    # The Actions token only reads and comments here. The app's token pushes.
    permissions:
      contents: read
      pull-requests: write
    env:
      PR_NUMBER: ${{ matrix.pull.number }}
      BRANCH: ${{ matrix.pull.branch }}
      HEAD_SHA: ${{ matrix.pull.head_sha }}
      CLEAN: ${{ matrix.pull.clean }}
      GUARDED: ${{ matrix.pull.guarded }}
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          persist-credentials: false

      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        if: matrix.pull.clean
        with:
          name: rebased
          path: ${{ runner.temp }}/bundles
      - name: Check the rebased branches are the find job's
        if: matrix.pull.clean
        env:
          REBASED_DIGEST: ${{ needs.find.outputs.digest }}
        run: |
          digest() { (cd "$1" && find . -type f -print0 | LC_ALL=C sort -z | xargs -0 -r sha256sum) | sha256sum | cut -c 1-64; }
          if [ "$(digest "$RUNNER_TEMP/bundles")" != "$REBASED_DIGEST" ]; then
            echo "The rebased branches aren't the ones the find job made."
            exit 1
          fi

      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        if: ${{ !matrix.pull.clean && !matrix.pull.guarded && needs.draft.result == 'success' }}
        continue-on-error: true
        with:
          name: resolved
          path: ${{ runner.temp }}/bundles
      - name: Check the resolved branches are the draft job's
        if: ${{ !matrix.pull.clean && !matrix.pull.guarded && needs.draft.result == 'success' }}
        env:
          RESOLVED_DIGEST: ${{ needs.draft.outputs.digest }}
        run: |
          mkdir -p "$RUNNER_TEMP/bundles"
          digest() { (cd "$1" && find . -type f -print0 | LC_ALL=C sort -z | xargs -0 -r sha256sum) | sha256sum | cut -c 1-64; }
          if [ "$(digest "$RUNNER_TEMP/bundles")" != "$RESOLVED_DIGEST" ]; then
            echo "The resolved branches aren't the ones the draft job made."
            exit 1
          fi

      # Git alone, running none of the branch's code: the rebased branch must sit on main, hold no
      # conflict markers, and change nothing in .github/ or Claude Code's own files, which the app
      # doesn't push.
      - name: Check the rebased branch with git alone
        id: guard
        run: |
          refuse() { echo "$1"; { echo "result=refused"; echo "reason=$1"; } >> "$GITHUB_OUTPUT"; exit 0; }
          if [ "$GUARDED" = true ]; then
            refuse "The branch's commits change .github/, Claude Code's own files, its dependencies (package.json or package-lock.json), an .npmrc, a .yarnrc, node_modules/ or the engine's pin in vendor/awml/, which the factory doesn't push or install, so it wasn't rebased."
          fi
          mkdir -p "$RUNNER_TEMP/bundles"
          bundle="$RUNNER_TEMP/bundles/$PR_NUMBER.bundle"
          if [ ! -s "$bundle" ]; then
            if [ "$CLEAN" = true ]; then refuse "The plain rebase left no rebased branch."; fi
            refuse "Claude couldn't resolve the conflict with confidence, or left no rebased branch."
          fi
          safe=(-c core.hooksPath=/dev/null -c core.fsmonitor=false)
          git "${safe[@]}" bundle verify -q "$bundle" > /dev/null 2>&1 || refuse "The rebased branch couldn't be read."
          git "${safe[@]}" fetch -q "$bundle" HEAD:refs/rebased || refuse "The rebased branch couldn't be read."
          git "${safe[@]}" merge-base --is-ancestor "$MAIN_SHA" refs/rebased || refuse "The rebased branch doesn't sit on main."
          if git "${safe[@]}" grep -qE '^(<<<<<<<|>>>>>>>)( |$)' refs/rebased --; then
            refuse "The rebased branch still holds conflict markers."
          fi
          guarded='^\.github/|(^|/)\.claude(/|$)|(^|/)\.mcp\.json$|(^|/)CLAUDE(\.local)?\.md$|(^|/)\.npmrc$|(^|/)\.yarnrc[^/]*$|(^|/)node_modules(/|$)|(^|/)npm-shrinkwrap\.json$|(^|/)yarn\.lock$|(^|/)package(-lock)?\.json$|^vendor/awml/'
          # The names go to a file that grep reads whole, with no pipe for it to cut short.
          git "${safe[@]}" diff --name-only --no-renames -z "$MAIN_SHA" refs/rebased > "$RUNNER_TEMP/names"
          if grep -qzE "$guarded" "$RUNNER_TEMP/names"; then
            refuse "The rebased branch changes .github/, Claude Code's own files, its dependencies, an .npmrc, a .yarnrc, node_modules/ or the engine's pin in vendor/awml/, which the factory doesn't push."
          fi
          { echo "result=push"; echo "new_sha=$(git rev-parse refs/rebased)"; } >> "$GITHUB_OUTPUT"

      - name: Make the app's token
        id: app
        if: steps.guard.outputs.result == 'push'
        uses: actions/create-github-app-token@d72941d797fd3113feb6b93fd0dec494b13a2547 # v1.12.0
        with:
          app-id: ${{ secrets.FACTORY_APP_ID }}
          private-key: ${{ secrets.FACTORY_APP_KEY }}
          owner: ${{ github.repository_owner }}
          repositories: ${{ github.event.repository.name }}
          permission-contents: write

      # Only if nobody pushed since the find job saw the branch.
      - name: Push the rebased branch
        id: push
        if: steps.guard.outputs.result == 'push'
        env:
          GH_TOKEN: ${{ steps.app.outputs.token }}
        run: |
          git -c core.hooksPath=/dev/null \
            -c http.https://github.com/.extraheader="AUTHORIZATION: basic $(printf 'x-access-token:%s' "$GH_TOKEN" | base64 -w0)" \
            push --force-with-lease="refs/heads/$BRANCH:$HEAD_SHA" origin "refs/rebased:refs/heads/$BRANCH"

      # One new comment, when it ends. The rest is fixed text with links; Claude's note is escaped:
      # < escaped, mentions broken, length capped.
      - name: Say how it ended
        id: tell
        if: ${{ !cancelled() }}
        env:
          GH_TOKEN: ${{ github.token }}
          PUSHED: ${{ steps.push.outcome }}
          REASON: ${{ steps.guard.outputs.reason }}
          NEW_SHA: ${{ steps.guard.outputs.new_sha }}
        run: |
          case "$PR_NUMBER" in ''|*[!0-9]*) echo "The pull request must be a number: $PR_NUMBER"; exit 1 ;; esac
          [[ "$BRANCH" =~ ^[A-Za-z0-9._/-]{1,200}$ ]] || { echo "The branch's name isn't plain: $BRANCH"; exit 1; }
          run_url="$GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID"
          commit_url="$GITHUB_SERVER_URL/$GITHUB_REPOSITORY/commit"
          {
            if [ "$PUSHED" = success ]; then
              echo "**Rebased this pull request onto \`main\` and pushed it.** CI reviews the pushed commit."
              echo
              echo "- The old head was [\`$HEAD_SHA\`]($commit_url/$HEAD_SHA), and the new one is [\`$NEW_SHA\`]($commit_url/$NEW_SHA)."
              echo "- To put the branch back, run \`git push --force origin $HEAD_SHA:$BRANCH\`."
            else
              echo "**The factory couldn't rebase this pull request onto \`main\`.** A person should rebase it by hand."
              echo
              if [ "$PUSHED" = failure ]; then
                echo "- Someone pushed to the branch meanwhile, so nothing was changed."
              elif [ -n "$REASON" ]; then
                printf -- '- %s\n' "$(printf '%s' "$REASON" | head -n 1 | cut -c 1-300)"
              else
                echo "- The run says which step failed."
              fi
            fi
            if [ -s "$RUNNER_TEMP/bundles/$PR_NUMBER.md" ]; then
              echo
              echo "### Claude's note"
              echo
              jq -jRs 'gsub("<"; "&lt;") | gsub("@(?=[A-Za-z0-9])"; "@​") | .[0:5000]' "$RUNNER_TEMP/bundles/$PR_NUMBER.md"
              echo
            fi
            echo
            echo "[The run]($run_url)"
          } > "$RUNNER_TEMP/comment.md"
          gh pr comment "$PR_NUMBER" --repo "$GITHUB_REPOSITORY" --body-file "$RUNNER_TEMP/comment.md"
