# The factory's rebase, drawn in .github/drawings/rebase-conflicting-pull-requests.yaml (A pull
# request that conflicts with main is rebased onto it). When a commit lands on main, each open pull
# request that GitHub marks as conflicting, from a branch of this repository opened by its own people
# or the build, is rebased onto main. Main doesn't require branches to be up to date, so only a
# conflict needs this. A plain git rebase comes first, and a clean one is pushed at once with no
# Claude session. Claude starts only on a real conflict, resolves it with a read-only token and hands
# back the rebased branch. It runs no checks of its own: the app's push starts CI, whose reviews run
# on the pushed commit, since a resolution is new code. When it ends, one new comment on each pull
# request says what was pushed, or why it couldn't be.
#
# The find job finds the conflicting pull requests and rebases each with git alone, hooks and
# fsmonitor off, running nothing from the branch. A branch whose commits change .github/ or Claude
# Code's own files isn't rebased at all, since the app doesn't push it: its comment says so. The draft job resolves each real conflict in a
# Claude session of its own. The push job runs on a fresh runner, shares none of the draft's access
# and runs nothing from the branch: it keeps the git-only guards, that the branch sits on main with
# no conflict markers and changes nothing in .github/ or Claude Code's own files, and force-pushes
# only if the branch hasn't moved since the find job saw it. The old commit stays on GitHub and the
# comment names it, so the replacement can be undone with one push.
#
# The rebased branches pass between jobs as artifacts of this run only, because the job split keeps
# the app's token away from the branch. The job that made each gives its sha256 as an output, and
# the push job checks it before it reads anything.
#
# Before it works, a repository needs the GitHub App, its two secrets and the
# CLAUDE_CODE_OAUTH_TOKEN secret that build.yml lists.
name: Rebase conflicting pull requests

on:
  push:
    branches: [main]

concurrency:
  group: resolve-main
  cancel-in-progress: true

env:
  MAIN_SHA: ${{ github.sha }}

jobs:
  find:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
      pull-requests: read
    outputs:
      pulls: ${{ steps.find.outputs.pulls }}
      conflicted: ${{ steps.find.outputs.conflicted }}
      digest: ${{ steps.find.outputs.digest }}
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          persist-credentials: false

      # A pull request is the build's when a bot opened it from a build/issue- branch in this
      # repository. A fork's, or one a stranger opened between two branches here, is never touched.
      # Each rebase runs in a worktree of its own as the app's bot, so the factory's branches stay
      # the factory's own commits.
      - name: Find the conflicting pull requests and rebase each with git alone
        id: find
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          rebased="$RUNNER_TEMP/rebased"
          mkdir -p "$rebased"
          bot_id="$(gh api "users/awml-factory%5Bbot%5D" --jq .id)"
          case "$bot_id" in ''|*[!0-9]*) echo "The app's bot has no id: $bot_id"; exit 1 ;; esac
          safe=(-c core.hooksPath=/dev/null -c core.fsmonitor=false -c user.name='awml-factory[bot]'
            -c user.email="$bot_id+awml-factory[bot]@users.noreply.github.com")
          auth="AUTHORIZATION: basic $(printf 'x-access-token:%s' "$GH_TOKEN" | base64 -w0)"
          pulls='[]'
          conflicted=false
          while read -r number; do
            case "$number" in ''|*[!0-9]*) continue ;; esac
            mergeable=UNKNOWN
            head_sha=
            for _ in 1 2 3 4 5; do
              details="$(gh pr view "$number" --repo "$GITHUB_REPOSITORY" --json mergeable,headRefOid)"
              mergeable="$(jq -r '.mergeable' <<< "$details")"
              head_sha="$(jq -r '.headRefOid' <<< "$details")"
              [ "$mergeable" != UNKNOWN ] && break
              sleep 2
            done
            [ "$mergeable" = CONFLICTING ] || continue
            [[ "$head_sha" =~ ^[0-9a-f]{40}$ ]] || continue

            pull="$(gh api "repos/$GITHUB_REPOSITORY/pulls/$number")"
            eligible="$(jq -r --arg repository "$GITHUB_REPOSITORY" '
              .base.ref == "main" and
              .head.repo.full_name == $repository and
              .head.ref != "factory-media" and
              ((.author_association | IN("OWNER", "MEMBER", "COLLABORATOR")) or
               (.user.type == "Bot" and (.head.ref | startswith("build/issue-"))))
            ' <<< "$pull")"
            [ "$eligible" = true ] || continue
            branch="$(jq -r '.head.ref' <<< "$pull")"
            [[ "$branch" =~ ^[A-Za-z0-9._/-]{1,200}$ ]] || continue

            git "${safe[@]}" -c http.https://github.com/.extraheader="$auth" fetch -q --no-tags origin "$head_sha"
            guarded='^\.github/|(^|/)\.claude(/|$)|(^|/)\.mcp\.json$|(^|/)CLAUDE(\.local)?\.md$|(^|/)\.npmrc$|(^|/)\.yarnrc[^/]*$|(^|/)node_modules(/|$)'
            if git "${safe[@]}" diff --name-only --no-renames -z "$(git merge-base "$MAIN_SHA" "$head_sha")" "$head_sha" |
              grep -zqE "$guarded"; then
              pulls="$(jq -c --argjson number "$number" --arg branch "$branch" --arg head_sha "$head_sha" \
                '. + [{number: $number, branch: $branch, head_sha: $head_sha, clean: false, guarded: true}]' <<< "$pulls")"
              continue
            fi
            worktree="$RUNNER_TEMP/rebase-$number"
            git "${safe[@]}" worktree add -q --detach "$worktree" "$head_sha"
            clean=false
            if git -C "$worktree" "${safe[@]}" rebase -q "$MAIN_SHA" > /dev/null 2>&1; then
              clean=true
              git -C "$worktree" "${safe[@]}" bundle create -q "$rebased/$number.bundle" "$MAIN_SHA..HEAD"
            else
              git -C "$worktree" "${safe[@]}" rebase --abort || true
              conflicted=true
            fi
            pulls="$(jq -c --argjson number "$number" --arg branch "$branch" --arg head_sha "$head_sha" \
              --argjson clean "$clean" '. + [{number: $number, branch: $branch, head_sha: $head_sha, clean: $clean, guarded: false}]' <<< "$pulls")"
          done < <(gh api --paginate "repos/$GITHUB_REPOSITORY/pulls?state=open&per_page=100" --jq '.[].number')

          digest() { (cd "$1" && find . -type f -print0 | LC_ALL=C sort -z | xargs -0 -r sha256sum) | sha256sum | cut -c 1-64; }
          {
            echo "pulls=$pulls"
            echo "conflicted=$conflicted"
            echo "digest=$(digest "$rebased")"
          } | tee -a "$GITHUB_OUTPUT"

      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: rebased
          path: ${{ runner.temp }}/rebased
          if-no-files-found: ignore

  # Resolves each real conflict in turn, each in a Claude session of its own, with a read-only
  # token. Each pull request gets a folder of its own under $RUNNER_TEMP/pr, made before any session
  # starts: a clone of the branch outside the workspace, its inputs, made read-only, its session's
  # output and its session's home. The session runs the whole rebase itself, git included, in its
  # clone, and bundles the result. The step that holds the login token runs no git, and host git
  # never touches a clone again: a later step reads each bundle as data into a fresh repository,
  # and gives the digest of what it keeps as the job's output.
  draft:
    needs: find
    if: needs.find.outputs.conflicted == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 120
    permissions:
      contents: read
      pull-requests: read
    outputs:
      digest: ${{ steps.check.outputs.digest }}
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          persist-credentials: false
      # Only for Claude Code, and for npm before the sessions. No npm cache is saved or restored.
      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5.0.0
        with:
          node-version: 22
          package-manager-cache: false

      # Main's prompt, scripts and AGENTS.md are copied out first. Each conflicting branch's head is
      # fetched into a local branch of the workspace, so its clone carries it and the check can read
      # it, and cloned with no hardlinks outside the workspace. The clone has no hooks, no fsmonitor
      # and no editor, and commits as the app's bot. Its dependencies are installed there, with npm's
      # config files and every package's scripts off, from npm's own registry: the find job held
      # back any branch that changes an .npmrc, a .yarnrc or node_modules/. Git runs here with hooks,
      # fsmonitor and global config off, before any session starts. The workspace's identity is
      # kept, for the check.
      - name: Prepare a clone of each conflicting branch, before any session starts
        id: prepare
        env:
          GH_TOKEN: ${{ github.token }}
          PULLS: ${{ needs.find.outputs.pulls }}
          npm_config_userconfig: /dev/null
          npm_config_globalconfig: /dev/null
          npm_config_registry: https://registry.npmjs.org/
          npm_config_ignore_scripts: "true"
        run: |
          stop="$(openssl rand -hex 16)"
          echo "::stop-commands::$stop"
          trap 'echo "::$stop::"' EXIT
          mkdir -p "$RUNNER_TEMP/main" "$RUNNER_TEMP/baseline" "$RUNNER_TEMP/check" "$RUNNER_TEMP/resolved"
          cp .github/resolve-prompt.md .github/claude-settings.sh .github/scan-tokens.sh AGENTS.md "$RUNNER_TEMP/main/"
          id="$(gh api "users/awml-factory%5Bbot%5D" --jq .id)"
          case "$id" in ''|*[!0-9]*) echo "The app's bot has no id: $id"; exit 1 ;; esac
          auth="AUTHORIZATION: basic $(printf 'x-access-token:%s' "$GH_TOKEN" | base64 -w0)"
          safe_git() { GIT_CONFIG_GLOBAL=/dev/null GIT_CONFIG_NOSYSTEM=1 command git -c core.hooksPath=/dev/null -c core.fsmonitor=false -c diff.external= "$@"; }
          : > "$RUNNER_TEMP/pulls.tsv"
          while IFS=$'\t' read -r number head_sha; do
            case "$number" in ''|*[!0-9]*) continue ;; esac
            [[ "$head_sha" =~ ^[0-9a-f]{40}$ ]] || continue
            root="$RUNNER_TEMP/pr/$number"
            mkdir -p "$root/in" "$root/out" "$root/home"
            GIT_CONFIG_COUNT=1 GIT_CONFIG_KEY_0=http.https://github.com/.extraheader GIT_CONFIG_VALUE_0="$auth" \
              safe_git fetch -q --no-tags origin "$head_sha:refs/heads/factory-rebase-$number"
            safe_git clone -q --no-hardlinks --no-checkout "$GITHUB_WORKSPACE" "$root/work"
            safe_git -C "$root/work" switch -q --detach "$head_sha"
            safe_git -C "$root/work" config core.hooksPath /dev/null
            safe_git -C "$root/work" config core.fsmonitor false
            safe_git -C "$root/work" config core.editor true
            safe_git -C "$root/work" config user.name "awml-factory[bot]"
            safe_git -C "$root/work" config user.email "$id+awml-factory[bot]@users.noreply.github.com"
            base="$(safe_git merge-base "$head_sha" "$MAIN_SHA")"
            safe_git log --oneline "$base..$head_sha" > "$root/in/branch-log.txt"
            safe_git log --oneline "$base..$MAIN_SHA" > "$root/in/main-log.txt"
            cp "$RUNNER_TEMP/main/AGENTS.md" "$root/in/"
            gh api "repos/$GITHUB_REPOSITORY/pulls/$number" --jq '"# " + .title + "\n\n" + (.body // "")' > "$root/in/pull-request.md"
            chmod -R a-w "$root/in"
            (cd "$root/work" && npm ci --ignore-scripts --no-audit --no-fund)
            stat -c %d:%i "$root/work" "$root/work/.git" > "$RUNNER_TEMP/baseline/clone-$number"
            printf '%s\t%s\n' "$number" "$head_sha" >> "$RUNNER_TEMP/pulls.tsv"
          done < <(jq -r '.[] | select(.clean == false and .guarded == false) | [.number, .head_sha] | @tsv' <<< "$PULLS")
          stat -c %d:%i "$GITHUB_WORKSPACE" "$GITHUB_WORKSPACE/.git" > "$RUNNER_TEMP/baseline/workspace"

      # Claude Code runs its commands in a sandbox, bubblewrap with socat for its network, and refuses
      # to start without it. Ubuntu's runners restrict the user namespaces bubblewrap needs, so allow
      # them on this throwaway machine, and check bubblewrap works before Claude starts.
      - name: Install Claude Code and bubblewrap
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y bubblewrap socat
          sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0 || true
          bwrap --dev-bind / / --unshare-pid true
          (cd "$RUNNER_TEMP" && npm_config_userconfig=/dev/null npm_config_globalconfig=/dev/null npm install -g @anthropic-ai/claude-code@2.1.312)

      # The branch's commits can steer each session. It loads only the settings claude-settings.sh
      # writes in its own home, and no MCP servers, and reads only its clone and its own folders,
      # never /proc. Its commands run in its sandbox, offline, seeing none of Claude Code's own
      # process, and unable to write another pull request's folder, its own inputs, main's scripts,
      # the check folders, the baseline or the workspace. It runs the rebase, git included, in its
      # own clone, and bundles the result. Under the scrub, Claude Code forces --permission-mode
      # default, so every tool it may use is named. This step runs no git, and holds no GitHub token.
      - name: Resolve the conflicts
        id: resolve
        env:
          CLAUDE_CODE_OAUTH_TOKEN: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          CLAUDE_CODE_SUBPROCESS_ENV_SCRUB: "1"
          MAIN_SHA: ${{ github.sha }}
          GIT_EDITOR: "true"
        run: |
          stop="$(openssl rand -hex 16)"
          echo "::stop-commands::$stop"
          trap 'echo "::$stop::"' EXIT
          while IFS=$'\t' read -r number _; do
            case "$number" in ''|*[!0-9]*) continue ;; esac
            root="$RUNNER_TEMP/pr/$number"
            denied=(--deny-write "$root/in")
            for other in "$RUNNER_TEMP"/pr/*; do
              if [ "$other" != "$root" ]; then denied+=(--deny-write "$other"); fi
            done
            for shared in main check resolved baseline pulls.tsv; do denied+=(--deny-write "$RUNNER_TEMP/$shared"); done
            denied+=(--deny-write "$GITHUB_WORKSPACE")
            bash "$RUNNER_TEMP/main/claude-settings.sh" "$root/home" "${denied[@]}"
            prompt="$(sed -e "s|RESOLVE_DIR|$root/in|g" -e "s|OUT_DIR|$root/out|g" -e "s|MAIN_SHA|$MAIN_SHA|g" \
              "$RUNNER_TEMP/main/resolve-prompt.md")"
            (
              cd "$root/work"
              HOME="$root/home" claude -p "$prompt" --model opus --max-turns 200 --permission-mode default \
                --setting-sources user --strict-mcp-config --add-dir "$root/in" --add-dir "$root/out" \
                --disallowedTools "Read(//proc/**)" "Edit(./.git/**)" "Write(./.git/**)" \
                --allowedTools "Read(./**)" "Read(/$root/in/**)" "Read(/$root/out/**)" "Edit(./**)" "Write(./**)" \
                  "Edit(/$root/out/**)" "Write(/$root/out/**)" \
                  "Bash(npm run:*)" "Bash(npm test:*)" \
                  "Bash(npx vitest:*)" "Bash(npx tsc:*)" "Bash(npx eslint:*)" \
                  "Bash(git status:*)" "Bash(git diff:*)" "Bash(git log:*)" "Bash(git show:*)" \
                  "Bash(git add:*)" "Bash(git rebase:*)" "Bash(git bundle create:*)" "Bash(ls:*)" \
                > "$root/session.log" 2>&1
            ) || echo "The session on #$number ended with an error."
            cat "$root/session.log"
          done < "$RUNNER_TEMP/pulls.tsv"

      # Each session's bundle is read as data into a fresh repository, whose config no session ever
      # touched, with no global or system config, hooks, fsmonitor or external diff, beside no login
      # token, and only if the workspace and the clone are the ones the session started beside and
      # in, and the out folder is reached through no symbolic link. It must sit on main, carry no conflict marker, and
      # change nothing the app never pushes. The lines its resolution adds, beyond those the branch
      # already added, and Claude's note, must carry nothing like a token. The digest of what's kept
      # is the job's output, which the push job checks it against.
      - name: Check each rebase, read into a fresh repository
        id: check
        if: ${{ !cancelled() }}
        env:
          MAIN_SHA: ${{ github.sha }}
          GIT_CONFIG_GLOBAL: /dev/null
          GIT_CONFIG_NOSYSTEM: "1"
        run: |
          stop="$(openssl rand -hex 16)"
          echo "::stop-commands::$stop"
          trap 'echo "::$stop::"' EXIT
          safe_git() { GIT_CONFIG_GLOBAL=/dev/null GIT_CONFIG_NOSYSTEM=1 command git -c core.hooksPath=/dev/null -c core.fsmonitor=false -c diff.external= "$@"; }
          if ! stat -c %d:%i "$GITHUB_WORKSPACE" "$GITHUB_WORKSPACE/.git" | cmp -s - "$RUNNER_TEMP/baseline/workspace"; then
            echo "The workspace or its .git isn't the one the sessions started beside, so nothing is read from it."
            exit 1
          fi
          guarded='^\.github/|(^|/)\.claude(/|$)|(^|/)\.mcp\.json$|(^|/)CLAUDE(\.local)?\.md$|(^|/)\.npmrc$|(^|/)\.yarnrc[^/]*$|(^|/)node_modules(/|$)'
          resolved="$RUNNER_TEMP/resolved"
          mkdir -p "$resolved" "$RUNNER_TEMP/check"
          while IFS=$'\t' read -r number head_sha; do
            case "$number" in ''|*[!0-9]*) continue ;; esac
            [[ "$head_sha" =~ ^[0-9a-f]{40}$ ]] || continue
            out="$RUNNER_TEMP/pr/$number/out"
            linked=false
            part="$out"
            while [ "$part" != / ] && [ -n "$part" ]; do
              if [ -L "$part" ]; then linked=true; fi
              part="$(dirname "$part")"
            done
            if [ "$linked" = true ]; then
              echo "The out folder of #$number is reached through a symbolic link, so nothing is read from it."
              continue
            fi
            work="$RUNNER_TEMP/pr/$number/work"
            if ! stat -c %d:%i "$work" "$work/.git" | cmp -s - "$RUNNER_TEMP/baseline/clone-$number"; then
              echo "The clone of #$number or its .git isn't the one its session started in, so nothing is read from it."
              continue
            fi
            fresh="$RUNNER_TEMP/check/$number"
            bundle="$out/rebased.bundle"
            safe_git init -q "$fresh"
            safe_git -C "$fresh" fetch -q --no-tags "$GITHUB_WORKSPACE" "$MAIN_SHA" "refs/heads/factory-rebase-$number"
            if [ -f "$bundle" ] && [ ! -L "$bundle" ] &&
              safe_git -C "$fresh" bundle verify -q "$bundle" > /dev/null 2>&1 &&
              safe_git -C "$fresh" fetch -q "$bundle" "HEAD:refs/rebased" &&
              safe_git -C "$fresh" merge-base --is-ancestor "$MAIN_SHA" refs/rebased &&
              ! safe_git -C "$fresh" grep -qE '^(<<<<<<<|>>>>>>>)( |$)' refs/rebased -- &&
              ! safe_git -C "$fresh" diff --name-only --no-ext-diff --no-textconv --no-renames -z "$MAIN_SHA" refs/rebased | grep -zqE "$guarded"; then
              base="$(safe_git -C "$fresh" merge-base "$head_sha" "$MAIN_SHA")"
              comm -23 <(safe_git -C "$fresh" diff --no-ext-diff --no-textconv "$MAIN_SHA" refs/rebased | LC_ALL=C grep -a '^+' | LC_ALL=C sort -u) \
                <(safe_git -C "$fresh" diff --no-ext-diff --no-textconv "$base" "$head_sha" | LC_ALL=C grep -a '^+' | LC_ALL=C sort -u) \
                > "$RUNNER_TEMP/check/$number.added"
              if bash "$RUNNER_TEMP/main/scan-tokens.sh" "$RUNNER_TEMP/check/$number.added"; then
                cp "$bundle" "$resolved/$number.bundle"
              else
                echo "The resolution of #$number adds what looks like a token, so it isn't kept."
              fi
            else
              echo "The session on #$number left no rebase that sits on main without conflict markers or files the app never pushes."
            fi
            if [ -f "$out/message.md" ] && [ ! -L "$out/message.md" ]; then
              head -c 20000 "$out/message.md" > "$RUNNER_TEMP/check/$number.md"
              if bash "$RUNNER_TEMP/main/scan-tokens.sh" "$RUNNER_TEMP/check/$number.md"; then
                cp "$RUNNER_TEMP/check/$number.md" "$resolved/$number.md"
              fi
            fi
          done < "$RUNNER_TEMP/pulls.tsv"
          digest() { (cd "$1" && find . -type f -print0 | LC_ALL=C sort -z | xargs -0 -r sha256sum) | sha256sum | cut -c 1-64; }
          echo "digest=$(digest "$resolved")" >> "$GITHUB_OUTPUT"

      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        if: ${{ !cancelled() }}
        with:
          name: resolved
          path: ${{ runner.temp }}/resolved
          if-no-files-found: ignore

  push:
    needs: [find, draft]
    if: ${{ !cancelled() && needs.find.result == 'success' && needs.find.outputs.pulls != '[]' }}
    strategy:
      fail-fast: false
      matrix:
        pull: ${{ fromJSON(needs.find.outputs.pulls) }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    # The Actions token only reads and comments here. The app's token pushes.
    permissions:
      contents: read
      pull-requests: write
    env:
      PR_NUMBER: ${{ matrix.pull.number }}
      BRANCH: ${{ matrix.pull.branch }}
      HEAD_SHA: ${{ matrix.pull.head_sha }}
      CLEAN: ${{ matrix.pull.clean }}
      GUARDED: ${{ matrix.pull.guarded }}
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          persist-credentials: false

      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        if: matrix.pull.clean
        with:
          name: rebased
          path: ${{ runner.temp }}/bundles
      - name: Check the rebased branches are the find job's
        if: matrix.pull.clean
        env:
          REBASED_DIGEST: ${{ needs.find.outputs.digest }}
        run: |
          digest() { (cd "$1" && find . -type f -print0 | LC_ALL=C sort -z | xargs -0 -r sha256sum) | sha256sum | cut -c 1-64; }
          if [ "$(digest "$RUNNER_TEMP/bundles")" != "$REBASED_DIGEST" ]; then
            echo "The rebased branches aren't the ones the find job made."
            exit 1
          fi

      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        if: ${{ !matrix.pull.clean && !matrix.pull.guarded && needs.draft.result == 'success' }}
        continue-on-error: true
        with:
          name: resolved
          path: ${{ runner.temp }}/bundles
      - name: Check the resolved branches are the draft job's
        if: ${{ !matrix.pull.clean && !matrix.pull.guarded && needs.draft.result == 'success' }}
        env:
          RESOLVED_DIGEST: ${{ needs.draft.outputs.digest }}
        run: |
          mkdir -p "$RUNNER_TEMP/bundles"
          digest() { (cd "$1" && find . -type f -print0 | LC_ALL=C sort -z | xargs -0 -r sha256sum) | sha256sum | cut -c 1-64; }
          if [ "$(digest "$RUNNER_TEMP/bundles")" != "$RESOLVED_DIGEST" ]; then
            echo "The resolved branches aren't the ones the draft job made."
            exit 1
          fi

      # Git alone, running none of the branch's code: the rebased branch must sit on main, hold no
      # conflict markers, and change nothing in .github/ or Claude Code's own files, which the app
      # doesn't push.
      - name: Check the rebased branch with git alone
        id: guard
        run: |
          refuse() { echo "$1"; { echo "result=refused"; echo "reason=$1"; } >> "$GITHUB_OUTPUT"; exit 0; }
          if [ "$GUARDED" = true ]; then
            refuse "The branch's commits change .github/, Claude Code's own files, an .npmrc, a .yarnrc or node_modules/, which the app doesn't push or install, so it wasn't rebased."
          fi
          mkdir -p "$RUNNER_TEMP/bundles"
          bundle="$RUNNER_TEMP/bundles/$PR_NUMBER.bundle"
          if [ ! -s "$bundle" ]; then
            if [ "$CLEAN" = true ]; then refuse "The plain rebase left no rebased branch."; fi
            refuse "Claude couldn't resolve the conflict with confidence, or left no rebased branch."
          fi
          safe=(-c core.hooksPath=/dev/null -c core.fsmonitor=false)
          git "${safe[@]}" bundle verify -q "$bundle" > /dev/null 2>&1 || refuse "The rebased branch couldn't be read."
          git "${safe[@]}" fetch -q "$bundle" HEAD:refs/rebased || refuse "The rebased branch couldn't be read."
          git "${safe[@]}" merge-base --is-ancestor "$MAIN_SHA" refs/rebased || refuse "The rebased branch doesn't sit on main."
          if git "${safe[@]}" grep -qE '^(<<<<<<<|>>>>>>>)( |$)' refs/rebased --; then
            refuse "The rebased branch still holds conflict markers."
          fi
          guarded='^\.github/|(^|/)\.claude(/|$)|(^|/)\.mcp\.json$|(^|/)CLAUDE(\.local)?\.md$|(^|/)\.npmrc$|(^|/)\.yarnrc[^/]*$|(^|/)node_modules(/|$)'
          if git "${safe[@]}" diff --name-only --no-renames -z "$MAIN_SHA" refs/rebased | grep -zqE "$guarded"; then
            refuse "The rebased branch changes .github/ or Claude Code's own files, which the app doesn't push."
          fi
          { echo "result=push"; echo "new_sha=$(git rev-parse refs/rebased)"; } >> "$GITHUB_OUTPUT"

      - name: Make the app's token
        id: app
        if: steps.guard.outputs.result == 'push'
        uses: actions/create-github-app-token@d72941d797fd3113feb6b93fd0dec494b13a2547 # v1.12.0
        with:
          app-id: ${{ secrets.FACTORY_APP_ID }}
          private-key: ${{ secrets.FACTORY_APP_KEY }}
          owner: ${{ github.repository_owner }}
          repositories: ${{ github.event.repository.name }}

      # Only if nobody pushed since the find job saw the branch.
      - name: Push the rebased branch
        id: push
        if: steps.guard.outputs.result == 'push'
        env:
          GH_TOKEN: ${{ steps.app.outputs.token }}
        run: |
          git -c core.hooksPath=/dev/null \
            -c http.https://github.com/.extraheader="AUTHORIZATION: basic $(printf 'x-access-token:%s' "$GH_TOKEN" | base64 -w0)" \
            push --force-with-lease="refs/heads/$BRANCH:$HEAD_SHA" origin "refs/rebased:refs/heads/$BRANCH"

      # One new comment, when it ends. The rest is fixed text with links; Claude's note is escaped:
      # < escaped, mentions broken, length capped.
      - name: Say how it ended
        id: tell
        if: ${{ !cancelled() }}
        env:
          GH_TOKEN: ${{ github.token }}
          PUSHED: ${{ steps.push.outcome }}
          REASON: ${{ steps.guard.outputs.reason }}
          NEW_SHA: ${{ steps.guard.outputs.new_sha }}
        run: |
          case "$PR_NUMBER" in ''|*[!0-9]*) echo "The pull request must be a number: $PR_NUMBER"; exit 1 ;; esac
          [[ "$BRANCH" =~ ^[A-Za-z0-9._/-]{1,200}$ ]] || { echo "The branch's name isn't plain: $BRANCH"; exit 1; }
          run_url="$GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID"
          commit_url="$GITHUB_SERVER_URL/$GITHUB_REPOSITORY/commit"
          {
            if [ "$PUSHED" = success ]; then
              echo "**Rebased this pull request onto \`main\` and pushed it.** CI reviews the pushed commit."
              echo
              echo "- The old head was [\`$HEAD_SHA\`]($commit_url/$HEAD_SHA), and the new one is [\`$NEW_SHA\`]($commit_url/$NEW_SHA)."
              echo "- To put the branch back, run \`git push --force origin $HEAD_SHA:$BRANCH\`."
            else
              echo "**The factory couldn't rebase this pull request onto \`main\`.** A person should rebase it by hand."
              echo
              if [ "$PUSHED" = failure ]; then
                echo "- Someone pushed to the branch meanwhile, so nothing was changed."
              elif [ -n "$REASON" ]; then
                printf -- '- %s\n' "$(printf '%s' "$REASON" | head -n 1 | cut -c 1-300)"
              else
                echo "- The run says which step failed."
              fi
            fi
            if [ -s "$RUNNER_TEMP/bundles/$PR_NUMBER.md" ]; then
              echo
              echo "### Claude's note"
              echo
              jq -jRs 'gsub("<"; "&lt;") | gsub("@(?=[A-Za-z0-9])"; "@​") | .[0:5000]' "$RUNNER_TEMP/bundles/$PR_NUMBER.md"
              echo
            fi
            echo
            echo "[The run]($run_url)"
          } > "$RUNNER_TEMP/comment.md"
          gh pr comment "$PR_NUMBER" --repo "$GITHUB_REPOSITORY" --body-file "$RUNNER_TEMP/comment.md"
