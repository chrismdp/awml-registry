# The factory's landing, drawn in .github/drawings/land-a-pull-request.yaml (A pull request lands
# once CI has run). A factory pull request lands once CI has judged its head commit. GitHub starts
# this when CI's pull_request run finishes on a build/issue-* branch; people merge their own pull
# requests. It reads everything from GitHub and git at that moment: whether the pull request is open
# at CI's commit, the head commit's checks, the reviews' Nits and Classify's verdict among them, the
# branch's commits since main, and the build rule run on that commit. It exits quietly unless every
# check on the head commit has finished, and CI's test, Bug review and Security review have passed:
# a failed one belongs to retry.yml or fix.yml. Classify, which may have been skipped or not
# succeeded, counts then as no verdict, which means ask.
#
# The rule can only move Classify's verdict towards ask. Ship merges, pinned with
# --match-head-commit to the commit judged. Show merges the same way, then tells the person who added
# the label what to look at, in a new comment. Ask requests their review in a new comment and
# doesn't merge: they merge from their own account, which is their yes. Nothing sets a pull request
# to merge by itself later, and main's own rule holds every merge until CI has passed.
name: Land a build's pull request

# GitHub runs this from main's copy, whatever the branch holds, and no job here checks out the
# branch or runs anything from it. The find job reads, with a token that can't write, and applies
# the rule, main's copy, to the head commit read with git as data. Only the sha, the outcome, the
# labeller's login and the rule's own reasons pass to the land job, as job outputs, so Classify's
# reasons are linked, never quoted. The land job mints the app's token, for this repository alone,
# for the merge, so the merge starts CI on main and the rebase workflow. Comments and review
# requests use the Actions token. It needs what build.yml lists.
on:
  workflow_run:
    workflows: [CI]
    types: [completed]
    branches: ["build/issue-*"]

# Named, so GitHub runs each step's script with bash -eo pipefail, not bash -e alone, and a failure
# inside a pipe fails the step.
defaults:
  run:
    shell: bash

jobs:
  # The reading has no concurrency group, since GitHub keeps one run waiting in a group and cancels
  # it for a newer one whatever cancel-in-progress says, and a run started by someone else's pull
  # request from a branch of the same name could then cancel the real reading. It only reads and
  # leaves quietly, and a reading that no longer matches the branch's head lands nothing, as the
  # land job checks.
  find:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      actions: read
      checks: read
      contents: read
      issues: read
      pull-requests: read
    outputs:
      go: ${{ steps.ready.outputs.go }}
      pr: ${{ steps.ready.outputs.pr }}
      issue: ${{ steps.ready.outputs.issue }}
      head_sha: ${{ steps.ready.outputs.head_sha }}
      labeller: ${{ steps.ready.outputs.labeller }}
      verdict: ${{ steps.judge.outputs.verdict }}
      reasons: ${{ steps.judge.outputs.reasons }}
      classify_url: ${{ steps.judge.outputs.classify_url }}
    steps:
      # Only a pull_request run, which runs once a commit, from a branch of this repository, since a
      # fork's branch can carry a build's name. The pull request must be open from the branch with
      # CI's commit as its head, every check on that commit must have finished, and test, Bug review
      # and Security review must have passed in CI's own run. A Classify that ended without success,
      # timed out or lost its runner, goes on to the rule as no verdict, which means ask. Anyone can
      # open a pull request from the build's branch, so only the one the factory's app opened is
      # landed. Whoever last added the issue's build label is asked; if the app added it, the owner is.
      - name: Check the pull request is open at CI's commit, with every check passed
        id: ready
        env:
          GH_TOKEN: ${{ github.token }}
          BRANCH: ${{ github.event.workflow_run.head_branch }}
          HEAD_SHA: ${{ github.event.workflow_run.head_sha }}
          HEAD_REPOSITORY: ${{ github.event.workflow_run.head_repository.full_name }}
          CI_EVENT: ${{ github.event.workflow_run.event }}
          CHECK_SUITE: ${{ github.event.workflow_run.check_suite_id }}
          RUN_ATTEMPT: ${{ github.event.workflow_run.run_attempt }}
          CI_RUN: ${{ github.event.workflow_run.id }}
        run: |
          # Whether GitHub says someone may write to the repository: their role or its base permission is
          # exactly admin, maintain or write, so a custom role counts only by what it grants.
          may_write() {
            [[ "$1" =~ ^[A-Za-z0-9-]{1,39}$ ]] || return 1
            local role="" permission=""
            IFS=$'\t' read -r role permission < <(gh api "repos/$GITHUB_REPOSITORY/collaborators/$1/permission" --jq '[.role_name // "", .permission // ""] | @tsv' || true) || true
            case "$role" in admin|maintain|write) return 0 ;; esac
            case "$permission" in admin|maintain|write) return 0 ;; esac
            return 1
          }
          leave() { echo "$1"; echo "go=false" >> "$GITHUB_OUTPUT"; exit 0; }
          [ "$HEAD_REPOSITORY" = "$GITHUB_REPOSITORY" ] && [ "$CI_EVENT" = pull_request ] ||
            leave "CI didn't run on a pull request from a branch of this repository."
          case "$BRANCH" in build/issue-*) issue="${BRANCH#build/issue-}" ;; *) leave "This isn't a build's branch." ;; esac
          case "$issue" in ''|*[!0-9]*) leave "This isn't a build's branch." ;; esac
          [[ "$HEAD_SHA" =~ ^[0-9a-f]{40}$ ]] || leave "CI's commit isn't a commit id."
          # A re-run after an attempt whose tests and both reviews all passed is for a commit land
          # already acted on, so it leaves; a re-run after a failed attempt is the first it can act on.
          case "$RUN_ATTEMPT" in ''|*[!0-9]*) leave "CI's attempt isn't a number." ;; esac
          case "$CI_RUN" in ''|*[!0-9]*) leave "CI's run isn't a number." ;; esac
          for earlier in $(seq 1 $((RUN_ATTEMPT - 1))); do
            if gh api "repos/$GITHUB_REPOSITORY/actions/runs/$CI_RUN/attempts/$earlier/jobs" --paginate --jq '.jobs[]' |
              jq -se '["test", "Bug review", "Security review"] as $required
                | . as $jobs | all($required[]; . as $name | any($jobs[]; .name == $name and .conclusion == "success"))' > /dev/null; then
              leave "Attempt $earlier of CI's run passed, and land acted on it then."
            fi
          done
          case "$CHECK_SUITE" in ''|*[!0-9]*) leave "CI's check suite isn't a number." ;; esac

          pr="$(gh api "repos/$GITHUB_REPOSITORY/pulls?head=$GITHUB_REPOSITORY_OWNER:$BRANCH&base=main&state=open" |
            jq -r --arg repository "$GITHUB_REPOSITORY" --arg branch "$BRANCH" --arg head "$HEAD_SHA" \
              '[.[] | select(.base.ref == "main" and .head.ref == $branch and .head.repo.full_name == $repository
                and .user.login == "awml-factory[bot]" and .user.type == "Bot"
                and .head.sha == $head)] | first | .number // empty')"
          case "$pr" in *[!0-9]*) leave "The pull request's number isn't a number." ;; esac
          [ -n "$pr" ] || leave "No open pull request on $BRANCH is at CI's commit, so a newer CI result decides."

          gh api --paginate "repos/$GITHUB_REPOSITORY/commits/$HEAD_SHA/check-runs?per_page=100" |
            jq -s '[.[].check_runs[]]' > "$RUNNER_TEMP/checks.json"
          jq -e 'all(.[]; .status == "completed")' "$RUNNER_TEMP/checks.json" > /dev/null ||
            leave "A check on $HEAD_SHA hasn't finished."
          jq -e --argjson suite "$CHECK_SUITE" '
              ["test", "Bug review", "Security review"] as $required
              | [.[] | select(.check_suite.id == $suite and .conclusion == "success") | .name] as $passed
              | all($required[]; . as $name | $passed | index($name))' "$RUNNER_TEMP/checks.json" > /dev/null ||
            leave "CI's run didn't pass test, Bug review and Security review on $HEAD_SHA."

          # The person told or asked is whoever last added the build label, if they may write to the
          # repository; if not, or if the app added it, the owner.
          labeller="$(gh api --paginate "repos/$GITHUB_REPOSITORY/issues/$issue/events" |
            jq -rs '[.[][] | select(.event == "labeled" and .label.name == "build")] | last
              | if .actor.type == "User" then .actor.login else "" end')"
          may_write "$labeller" || labeller="$GITHUB_REPOSITORY_OWNER"
          # A person who took the label off decides: the rule then asks.
          if [ "$(gh api "repos/$GITHUB_REPOSITORY/issues/$issue" --jq '[.labels[].name] | index("build") != null')" = true ]; then
            labelled=true
          else
            labelled=false
          fi
          {
            echo "go=true"
            echo "pr=$pr"
            echo "issue=$issue"
            echo "head_sha=$HEAD_SHA"
            echo "labeller=$labeller"
            echo "labelled=$labelled"
          } | tee -a "$GITHUB_OUTPUT"

      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        if: steps.ready.outputs.go == 'true'
        with:
          ref: main
          fetch-depth: 0
          persist-credentials: false
      # The rule needs only Node and git. Nothing is installed, and no npm cache is restored.
      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5.0.0
        if: steps.ready.outputs.go == 'true'
        with:
          node-version: 22
          package-manager-cache: false

      # The rule, its settings and the scripts come from main as it is now. The head commit is
      # fetched into git's store, never checked out. Its tree is read into the index of a worktree
      # of its own at its merge-base with main, so the files on disk stay main's,
      # and the rule reads the whole change and the branch's commits since main. Classify's verdict,
      # and the Nits the reviews left, are read from the checks of CI's run. The rule's copy is an
      # .mts file so that Node reads it as a module without a package.json beside it.
      - name: Apply the rule to the head commit
        id: judge
        if: steps.ready.outputs.go == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          HEAD_SHA: ${{ steps.ready.outputs.head_sha }}
          CI_RUN: ${{ github.event.workflow_run.id }}
          LABELLED: ${{ steps.ready.outputs.labelled }}
        run: |
          cp scripts/build-rule.ts "$RUNNER_TEMP/build-rule.mts"
          cp .github/review-findings.sh .github/build-rules.yml "$RUNNER_TEMP/"
          nits="$(bash "$RUNNER_TEMP/review-findings.sh" nits "$CI_RUN")"
          classified="$(bash "$RUNNER_TEMP/review-findings.sh" verdict "$CI_RUN")"
          gh api "repos/$GITHUB_REPOSITORY/actions/runs/$CI_RUN/jobs" --paginate --jq '.jobs[]' | jq -s . > "$RUNNER_TEMP/jobs.json"
          classify_url="$(jq -r '[.[] | select(.name == "Classify")] | last | .html_url // ""' "$RUNNER_TEMP/jobs.json")"
          # A Classify job that didn't succeed may have left a verdict it never finished weighing.
          if ! jq -e '[.[] | select(.name == "Classify")] | last | .conclusion == "success"' "$RUNNER_TEMP/jobs.json" > /dev/null; then
            classified=missing
          fi
          git -c core.hooksPath=/dev/null -c core.fsmonitor=false \
            -c http.https://github.com/.extraheader="AUTHORIZATION: basic $(printf 'x-access-token:%s' "$GH_TOKEN" | base64 -w0)" \
            fetch --no-tags origin "$HEAD_SHA"
          base="$(git merge-base HEAD "$HEAD_SHA")"
          git worktree add -q --detach "$RUNNER_TEMP/judged" "$base"
          git -C "$RUNNER_TEMP/judged" read-tree "$HEAD_SHA"
          node --experimental-strip-types "$RUNNER_TEMP/build-rule.mts" --repo "$RUNNER_TEMP/judged" \
            --rules "$RUNNER_TEMP/build-rules.yml" --classified "$classified" --nits "$nits" \
            --base "$base" --head "$HEAD_SHA" > "$RUNNER_TEMP/verdict.txt"
          if [ "$LABELLED" != true ]; then
            {
              echo ask
              echo "The build label was taken off the issue, so a person decides."
              tail -n +2 "$RUNNER_TEMP/verdict.txt" | grep -vxF "No review rule matched this change." || true
            } > "$RUNNER_TEMP/verdict.label"
            mv "$RUNNER_TEMP/verdict.label" "$RUNNER_TEMP/verdict.txt"
          fi
          stop="$(openssl rand -hex 16)"
          echo "::stop-commands::$stop"
          cat "$RUNNER_TEMP/verdict.txt"
          echo "::$stop::"
          verdict="$(head -n 1 "$RUNNER_TEMP/verdict.txt")"
          case "$verdict" in
            ship|show|ask) ;;
            *) echo "The build rule gave an unknown verdict: $verdict"; exit 1 ;;
          esac
          [[ "$classify_url" =~ ^https://github\.com/[A-Za-z0-9._/-]+$ ]] || classify_url=""
          {
            echo "verdict=$verdict"
            echo "reasons=$(tail -n +2 "$RUNNER_TEMP/verdict.txt" | jq -Rsc 'split("\n") | map(select(. != "") | .[0:500]) | .[0:20]')"
            echo "classify_url=$classify_url"
          } >> "$GITHUB_OUTPUT"

  # Ships, shows or asks. It checks out nothing and runs only gh. Each pull request lands on its
  # own.
  # Nothing cancels a land that has started, since it may be merging: a newer one waits for it, then
  # finds the pull request merged or moved, and leaves it.
  land:
    needs: find
    if: needs.find.outputs.go == 'true'
    concurrency:
      group: land-merge-${{ github.event.workflow_run.head_repository.full_name }}-${{ github.event.workflow_run.head_branch }}
      cancel-in-progress: false
    runs-on: ubuntu-latest
    timeout-minutes: 10
    # The Actions token checks the head, comments and requests a review. The app's token merges.
    permissions:
      pull-requests: write
    env:
      PR_NUMBER: ${{ needs.find.outputs.pr }}
      ISSUE: ${{ needs.find.outputs.issue }}
      HEAD_SHA: ${{ needs.find.outputs.head_sha }}
      VERDICT: ${{ needs.find.outputs.verdict }}
      LABELLER: ${{ needs.find.outputs.labeller }}
      REASONS: ${{ needs.find.outputs.reasons }}
      CLASSIFY_URL: ${{ needs.find.outputs.classify_url }}
    steps:
      # The rule judged the commit CI ran on, so a pull request that has moved on since, or closed,
      # is left to its newer CI result.
      - name: Check the pull request is still at the commit judged
        id: head
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          case "$PR_NUMBER" in ''|*[!0-9]*) echo "The pull request must be a number: $PR_NUMBER"; exit 1 ;; esac
          pull="$(gh api "repos/$GITHUB_REPOSITORY/pulls/$PR_NUMBER")"
          if [ "$(jq -r .state <<< "$pull")" = open ] && [ "$(jq -r .head.sha <<< "$pull")" = "$HEAD_SHA" ]; then
            echo "current=true" >> "$GITHUB_OUTPUT"
          else
            echo "#$PR_NUMBER has moved on since CI ran, or closed, so a newer CI result decides."
            echo "current=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Make the app's token
        id: app
        if: steps.head.outputs.current == 'true' && (needs.find.outputs.verdict == 'ship' || needs.find.outputs.verdict == 'show')
        uses: actions/create-github-app-token@d72941d797fd3113feb6b93fd0dec494b13a2547 # v1.12.0
        with:
          app-id: ${{ secrets.FACTORY_APP_ID }}
          private-key: ${{ secrets.FACTORY_APP_KEY }}
          owner: ${{ github.repository_owner }}
          repositories: ${{ github.event.repository.name }}
          permission-contents: write
          permission-pull-requests: write

      # Pinned to the commit judged, so GitHub refuses the merge if anyone pushed since, and main's
      # rule still holds it.
      - name: Merge, pinned to the commit judged
        id: merge
        if: steps.head.outputs.current == 'true' && (needs.find.outputs.verdict == 'ship' || needs.find.outputs.verdict == 'show')
        env:
          GH_TOKEN: ${{ steps.app.outputs.token }}
        run: |
          case "$PR_NUMBER" in ''|*[!0-9]*) echo "The pull request must be a number: $PR_NUMBER"; exit 1 ;; esac
          [[ "$HEAD_SHA" =~ ^[0-9a-f]{40}$ ]] || { echo "The commit judged isn't a commit id: $HEAD_SHA"; exit 1; }
          case "$VERDICT" in
            ship) said="Shipped: CI passed it, and the build rule and Classify found it plain." ;;
            show) said="Shown: CI passed it, and it merged, but the build rule asks that a person look at it afterwards." ;;
            *) echo "Only ship and show merge: $VERDICT"; exit 1 ;;
          esac
          {
            echo "$said"
            echo
            jq -r '.[] | "- \(.)"' <<< "$REASONS"
            echo
            echo "To undo it, use the Revert button on this pull request."
          } > "$RUNNER_TEMP/merge.md"
          gh pr merge "$PR_NUMBER" --repo "$GITHUB_REPOSITORY" --squash --match-head-commit "$HEAD_SHA" \
            --body-file "$RUNNER_TEMP/merge.md"

      # A new comment, since a person must act: on show, what to look at in what merged; on ask, a
      # review request. The rule's reasons are its own fixed text, with any path shown escaped in a
      # code span, and Classify's reasons are linked, never quoted.
      - name: Tell the person who added the label
        id: tell
        if: steps.head.outputs.current == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          [ "$VERDICT" != ship ] || exit 0
          [[ "$LABELLER" =~ ^[A-Za-z0-9-]{1,39}$ ]] || LABELLER="$GITHUB_REPOSITORY_OWNER"
          run_url="$GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID"
          classify="Classify's check"
          [ -z "$CLASSIFY_URL" ] || classify="[Classify's check]($CLASSIFY_URL)"
          {
            if [ "$VERDICT" = show ]; then
              echo "@$LABELLER, this merged, and the build rule asks that you look at it now. What to look at:"
            else
              echo "@$LABELLER, this needs your review before it merges, because:"
            fi
            echo
            jq -r '.[] | "- \(.)"' <<< "$REASONS"
            echo
            echo "$classify gives Classify's own reasons."
            if [ "$VERDICT" = ask ]; then
              echo "Merge it from your own account once you're happy. CI has passed on its head commit."
            fi
            echo
            echo "[The run]($run_url)"
          } > "$RUNNER_TEMP/tell.md"
          if [ "$VERDICT" = ask ] && ! gh pr edit "$PR_NUMBER" --repo "$GITHUB_REPOSITORY" --add-reviewer "$LABELLER"; then
            echo "::warning::Could not ask $LABELLER to review the pull request."
          fi
          gh pr comment "$PR_NUMBER" --repo "$GITHUB_REPOSITORY" --body-file "$RUNNER_TEMP/tell.md"
