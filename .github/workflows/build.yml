# The factory's build, drawn in .github/drawings/issue-to-pull-request.yaml (An issue becomes a
# pull request). An issue the maintainer labels build becomes a pull request. Only people with write
# access, and the repository's own app, can add a label, so the label is the decision. The build
# says on the issue, in one new comment, that it has started. Claude drafts with a read-only token,
# from the issue as GitHub renders it, unedited since the label was last added, with only the
# comments of the repository's own people, and why the last try failed, read from CI's latest run on
# the issue's branch. The pages the change alters are pictured, before and after. The app then
# pushes the branch and the pictures and opens the pull request, which says Closes #n, unless one is
# open from the branch already, which the push updates.
#
# The build runs no checks of its own. CI judges the commit when the pull request opens or the push
# updates it, as it judges every pull request, and land.yml, fix.yml and retry.yml each wake when CI
# finishes, reading GitHub rather than anything this workflow writes. A draft that touches .github/
# or Claude Code's own files, .claude/, .mcp.json or a CLAUDE.md, isn't pushed: it's offered in a
# new comment with the commands to download and apply it, and the build stops.
#
# retry.yml starts a build again with only the issue's number. The start job then checks that the
# label is still on, and that the issue's last edit, from GraphQL, is older than the label's last
# labelled event, or it stops with a new comment asking for the label again.
name: Build from an issue
# GitHub names each run for its issue, so retry.yml can count the build's runs for an issue since
# the label was last added.
run-name: ${{ (github.event_name == 'workflow_dispatch' || github.event.label.name == 'build') && format('Build of issue {0}', inputs.issue || github.event.issue.number) || format('A label added to issue {0}', github.event.issue.number) }}

# Before it works, a repository needs:
# - a GitHub App with read and write access to contents, pull requests and issues, installed on the
#   repository, with its app id in a FACTORY_APP_ID secret and a private key in FACTORY_APP_KEY. The
#   app must NOT have the workflows permission, so nothing it pushes can change a workflow;
# - a CLAUDE_CODE_OAUTH_TOKEN secret, made with `claude setup-token`, so the runs come out of the
#   maintainer's subscription rather than a metered API key;
# - a build label;
# - a ruleset on main that requires CI's test, Bug review and Security review checks. It must cover
#   main alone, so that the app can push the factory-media branch.
#
# The app pushes and opens, because GitHub starts other workflows from what an app does but not
# from what the Actions token does, so CI runs on the pull request. The open job mints the app's
# token, for this repository alone, and gives it only to the steps that push and open. Comments use
# the Actions token. No job that runs Claude or the change's code holds a token that can write.
#
# The draft and pictures jobs hand their work to the open job as artifacts of this run only, because
# the job split keeps the app's token away from the change's code. Each gives its artifact's sha256
# as an output, which the open job checks before it uses anything.
#
# A change that alters what a page shows is pictured, before and after. Claude names the pages in
# pictures.json beside its patch. The pictures job runs .github/picture-pages.sh as it is on main,
# with a token that only reads and no secret. It builds and serves the registry from main and then
# from the change, fills each with the same people, workflows and platforms from
# scripts/seed-pictures.ts, and pictures each page at desktop width, 1280 pixels, and at phone
# width, 390. A page that moves when someone uses it is recorded as a GIF of the moves Claude lists.
# The open job checks every picture, pushes them to the factory-media branch, which holds only
# pictures, and shows them in the pull request. If a picture fails a check, or the pictures job
# fails, all the pictures are left out and the description says why.
on:
  issues:
    types: [labeled]
  # retry.yml starts each try after the first, and a person can start one by hand.
  workflow_dispatch:
    inputs:
      issue:
        description: The number of the issue to build
        required: true

# Each label added to an issue starts a run, and the app opens an issue with two labels at once. So
# only a build has the issue's group, and a run for any other label can't cancel the build.
concurrency:
  group: ${{ (github.event_name == 'workflow_dispatch' || github.event.label.name == 'build') && format('build-issue-{0}', inputs.issue || github.event.issue.number) || format('build-other-label-{0}', github.run_id) }}
  cancel-in-progress: true

env:
  ISSUE: ${{ inputs.issue || github.event.issue.number }}

jobs:
  # Checks the label and the issue's last edit, then says on the issue that the build has started,
  # in a new comment linking the run. It checks out nothing and runs only gh.
  start:
    if: github.event_name == 'workflow_dispatch' || github.event.label.name == 'build'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      issues: write
    outputs:
      go: ${{ steps.start.outputs.go }}
    steps:
      - name: Check the label and the issue's last edit, and say the build has started
        id: start
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          case "$ISSUE" in ''|*[!0-9]*) echo "The issue must be a number: $ISSUE"; exit 1 ;; esac
          run_url="$GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID"
          here="$RUNNER_TEMP/start"
          mkdir -p "$here"
          # shellcheck disable=SC2016 # The query's variables are GraphQL's.
          gh api graphql -F owner="$GITHUB_REPOSITORY_OWNER" -f name="${GITHUB_REPOSITORY#*/}" -F number="$ISSUE" -f query='
            query($owner: String!, $name: String!, $number: Int!) {
              repository(owner: $owner, name: $name) {
                issue(number: $number) {
                  lastEditedAt
                  labels(first: 100) { nodes { name } }
                  timelineItems(itemTypes: [LABELED_EVENT, RENAMED_TITLE_EVENT], last: 100) {
                    nodes { __typename ... on LabeledEvent { createdAt label { name } } ... on RenamedTitleEvent { createdAt } }
                  }
                }
              }
            }' > "$here/issue.json"
          if ! jq -e '.data.repository.issue.labels.nodes | any(.name == "build")' "$here/issue.json" > /dev/null; then
            echo "The build label is no longer on #$ISSUE, so there's nothing to build."
            echo "go=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          # A new title doesn't change lastEditedAt, so a rename since the label counts as an edit too.
          labelled="$(jq -r '[.data.repository.issue.timelineItems.nodes[] | select(.label.name == "build") | .createdAt] | last // empty' "$here/issue.json")"
          edited="$(jq -r '.data.repository.issue | [.lastEditedAt // empty, (.timelineItems.nodes[] | select(.__typename == "RenamedTitleEvent") | .createdAt)] | max // empty' "$here/issue.json")"
          if [ -z "$labelled" ] || { [ -n "$edited" ] && [[ "$edited" > "$labelled" ]]; }; then
            {
              echo "**This issue was edited since the build label was last added, so the build won't draft from it.**"
              echo
              echo "To build it as it reads now, remove the build label and add it again."
              echo
              echo "[The run]($run_url)"
            } > "$here/comment.md"
            gh issue comment "$ISSUE" --repo "$GITHUB_REPOSITORY" --body-file "$here/comment.md"
            echo "go=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          printf '**Building this issue.** CI judges the pull request it opens. [The run](%s)\n' "$run_url" > "$here/comment.md"
          gh issue comment "$ISSUE" --repo "$GITHUB_REPOSITORY" --body-file "$here/comment.md"
          echo "go=true" >> "$GITHUB_OUTPUT"

  # Claude works here with a read-only token and hands back a patch, with the pages it alters named
  # in pictures.json. Every command it runs, npm ci and the tests included, runs in its sandbox:
  # the job runs none of the change's code beside the token. The job gives the change's digest as
  # its output.
  draft:
    needs: start
    if: needs.start.outputs.go == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 60
    permissions:
      actions: read
      contents: read
      issues: read
    outputs:
      changed: ${{ steps.patch.outputs.changed }}
      pictures: ${{ steps.patch.outputs.pictures }}
      digest: ${{ steps.pack.outputs.digest }}
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          persist-credentials: false
      # Only for Claude Code, and for npm inside its sandbox. No npm cache is saved or restored.
      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5.0.0
        with:
          node-version: 22
          package-manager-cache: false

      # The session follows main's prompt, AGENTS.md and REVIEW.md, copied out before it starts.
      - name: Copy main's prompt, scripts, AGENTS.md and REVIEW.md out
        run: |
          mkdir -p "$RUNNER_TEMP/main" "$RUNNER_TEMP/input"
          cp .github/build-prompt.md .github/claude-settings.sh .github/scan-tokens.sh .github/check-lockfile.sh "$RUNNER_TEMP/main/"
          cp AGENTS.md REVIEW.md "$RUNNER_TEMP/input/"

      # The label approves the issue as it reads then, and a try drafts from it only if it hasn't
      # been edited or renamed since the label was last added. Its text and its comments are read as GitHub
      # renders them, bodyHTML, never the raw body, so HTML comments and hidden markup never reach
      # Claude (chrismdp/awml#150). Anyone can comment, but only the comments of those GitHub says
      # may write to the repository are passed on.
      - name: Keep the issue's text and its people's comments, as GitHub renders them
        id: keep
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          case "$ISSUE" in ''|*[!0-9]*) echo "The issue must be a number: $ISSUE"; exit 1 ;; esac
          input="$RUNNER_TEMP/input"
          mkdir -p "$input"
          # shellcheck disable=SC2016 # The query's variables are GraphQL's.
          gh api graphql -F owner="$GITHUB_REPOSITORY_OWNER" -f name="${GITHUB_REPOSITORY#*/}" -F number="$ISSUE" -f query='
            query($owner: String!, $name: String!, $number: Int!) {
              repository(owner: $owner, name: $name) {
                issue(number: $number) {
                  number
                  title
                  bodyHTML
                  lastEditedAt
                  timelineItems(itemTypes: [LABELED_EVENT, RENAMED_TITLE_EVENT], last: 100) {
                    nodes { __typename ... on LabeledEvent { createdAt label { name } } ... on RenamedTitleEvent { createdAt } }
                  }
                  comments(first: 100) { nodes { author { login } createdAt bodyHTML } }
                }
              }
            }' > "$RUNNER_TEMP/issue.json"
          labelled="$(jq -r '[.data.repository.issue.timelineItems.nodes[] | select(.label.name == "build") | .createdAt] | last // empty' "$RUNNER_TEMP/issue.json")"
          edited="$(jq -r '.data.repository.issue | [.lastEditedAt // empty, (.timelineItems.nodes[] | select(.__typename == "RenamedTitleEvent") | .createdAt)] | max // empty' "$RUNNER_TEMP/issue.json")"
          if [ -z "$labelled" ] || { [ -n "$edited" ] && [[ "$edited" > "$labelled" ]]; }; then
            echo "The issue was edited since the build label was last added, so it isn't drafted from."
            exit 1
          fi
          # A comment is kept by what GitHub says its author may do to the repository, write,
          # maintain or admin, not by how they're associated with it: a member may only triage.
          jq -r '[.data.repository.issue.comments.nodes[].author.login // empty] | unique | .[]' "$RUNNER_TEMP/issue.json" |
            while IFS= read -r login; do
              [[ "$login" =~ ^[A-Za-z0-9-]{1,39}$ ]] || continue
              role="$(gh api "repos/$GITHUB_REPOSITORY/collaborators/$login/permission" --jq .role_name || true)"
              case "$role" in admin|maintain|write) echo "$login" ;; esac
            done | jq -Rsc 'split("\n") | map(select(. != ""))' > "$RUNNER_TEMP/writers.json"
          jq -r --slurpfile writers "$RUNNER_TEMP/writers.json" '.data.repository.issue as $issue
            | "# #\($issue.number): \($issue.title)\n\n\($issue.bodyHTML)\n",
              ($issue.comments.nodes[] | select(.author.login as $login | $writers[0] | index([$login]))
                | "## Comment by \(.author.login), \(.createdAt)\n\n\(.bodyHTML)\n")' \
            "$RUNNER_TEMP/issue.json" > "$input/issue.md"

      # Why the last try failed comes from CI itself: the failed tests' log of CI's latest
      # pull_request run on the issue's branch, from this repository, if its tests failed. A fork's
      # branch can carry a build's name, so its runs are left out. The log is the output of the
      # branch's code, so the draft reads it as untrusted.
      - name: Bring in why the last try failed
        id: why
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          input="$RUNNER_TEMP/input"
          mkdir -p "$input"
          run="$(gh api "repos/$GITHUB_REPOSITORY/actions/workflows/ci.yml/runs?branch=build/issue-$ISSUE&event=pull_request&per_page=20" |
            jq -r --arg repository "$GITHUB_REPOSITORY" \
              '[.workflow_runs[] | select(.event == "pull_request" and .head_repository.full_name == $repository)] | first
                | select(.conclusion == "failure") | .id // empty')"
          case "$run" in *[!0-9]*) echo "CI's run isn't a number: $run"; exit 1 ;; esac
          [ -n "$run" ] || exit 0
          gh api "repos/$GITHUB_REPOSITORY/actions/runs/$run/jobs" |
            jq -r '.jobs[] | select(.name == "test" and .conclusion == "failure") | .id' |
            while read -r job; do
              case "$job" in ''|*[!0-9]*) continue ;; esac
              gh run view --job "$job" --repo "$GITHUB_REPOSITORY" --log-failed || true
            done | tail -n 300 > "$RUNNER_TEMP/failed.log"
          # Only a log with something in it tells the draft why the last try failed.
          if [ -s "$RUNNER_TEMP/failed.log" ]; then mv "$RUNNER_TEMP/failed.log" "$input/failed.log"; fi

      # The session runs the checks but can't install: under the scrub, Claude Code denies its
      # commands writes to node_modules/.bin and package-lock.json, and its sandbox has no network.
      # So the dependencies are installed here, with every package's scripts off, so no code of
      # theirs runs beside the secret, and from npm's own registry, whatever an .npmrc says. None of
      # the registry's checks needs a package's install script. npm still runs a git dependency's
      # prepare script, so the lockfile must name only packages from npm's registry, with their
      # integrity. Git's config is copied out, for the check after the session.
      - name: Install the dependencies with their scripts off
        env:
          npm_config_userconfig: /dev/null
          npm_config_globalconfig: /dev/null
          npm_config_registry: https://registry.npmjs.org/
          npm_config_ignore_scripts: "true"
        run: |
          stop="$(openssl rand -hex 16)"
          echo "::stop-commands::$stop"
          bash "$RUNNER_TEMP/main/check-lockfile.sh" .
          npm ci --ignore-scripts --no-audit --no-fund
          echo "::$stop::"
          mkdir -p "$RUNNER_TEMP/baseline"
          cp .git/config "$RUNNER_TEMP/baseline/git-config"
          stat -c %d:%i "$GITHUB_WORKSPACE" "$GITHUB_WORKSPACE/.git" > "$RUNNER_TEMP/baseline/workspace"

      # Claude Code runs its commands in a sandbox, bubblewrap with socat for its network, and refuses
      # to start without it. Ubuntu's runners restrict the user namespaces bubblewrap needs, so allow
      # them on this throwaway machine, and check bubblewrap works before Claude starts.
      - name: Install Claude Code and bubblewrap
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y bubblewrap socat
          sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0 || true
          bwrap --dev-bind / / --unshare-pid true
          (cd "$RUNNER_TEMP" && npm_config_userconfig=/dev/null npm_config_globalconfig=/dev/null npm install -g @anthropic-ai/claude-code@2.1.312)

      # Claude Code holds the maintainer's login token for its own calls and strips it, with any
      # other credential, from the commands it runs, which run in its sandbox: they see none of
      # Claude Code's own process, reach no network, and can't write git's files. Under the scrub,
      # Claude Code forces --permission-mode default, so every tool it may use is named. It loads
      # only the settings claude-settings.sh writes in a home of its own, and no MCP servers, since
      # Claude Code picks up a settings file or a .mcp.json that appears in its tree while it runs.
      # It reads only the workspace and its inputs, never /proc, and writes its notes in a folder of
      # its own.
      - name: Draft the change
        id: session
        env:
          CLAUDE_CODE_OAUTH_TOKEN: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          CLAUDE_CODE_SUBPROCESS_ENV_SCRUB: "1"
          INPUT_DIR: ${{ runner.temp }}/input
        run: |
          {
          # One group, which bash reads whole before claude starts, so nothing a command in
          # the session writes to this script, which is denied to it, can run after it.
          chmod -R a-w "$INPUT_DIR"
          session="$RUNNER_TEMP/sessions/build"
          rm -rf "$session"
          mkdir -p "$session/out"
          bash "$RUNNER_TEMP/main/claude-settings.sh" "$session/home" --deny-write "$0" --deny-write ./.git --deny-write "$RUNNER_TEMP/baseline" \
            --deny-write "$RUNNER_TEMP/change"
          prompt="$(sed -e "s|INPUT_DIR|$INPUT_DIR|g" -e "s|OUT_DIR|$session/out|g" "$RUNNER_TEMP/main/build-prompt.md")"
          status=0
          HOME="$session/home" claude -p "$prompt" --model opus --max-turns 200 --permission-mode default \
            --setting-sources user --strict-mcp-config --add-dir "$INPUT_DIR" --add-dir "$session/out" \
            --disallowedTools "Read(//proc/**)" "Edit(./.git/**)" "Write(./.git/**)" \
            --allowedTools "Read(./**)" "Read(/$INPUT_DIR/**)" "Edit(./**)" "Write(./**)" \
              "Edit(/$session/out/**)" "Write(/$session/out/**)" \
              "Bash(npm run:*)" "Bash(npm test:*)" \
              "Bash(npx vitest:*)" "Bash(npx tsc:*)" "Bash(npx eslint:*)" \
              "Bash(git status:*)" "Bash(git diff:*)" "Bash(git log:*)" "Bash(ls:*)" \
            > "$session/log" 2>&1 || status=$?
          stop="$(openssl rand -hex 16)"
          echo "::stop-commands::$stop"
          cat "$session/log"
          echo "::$stop::"
          exit "$status"
          }

      # The pages are pictured unless Claude named none: no pictures.json, or an empty list. A
      # pictures.json that isn't a list still starts the pictures job, which says what is wrong.
      # Git reads the tree the session wrote, so it runs nothing the session's commands could have
      # set: the workspace and its .git must be the ones the session started in, git's config byte
      # for byte as it was, kept where the session couldn't write, and no repository nested below
      # the top; no global or system config is read, and no hook, fsmonitor, external diff or text
      # conversion runs.
      - name: Make the patch
        id: patch
        env:
          GIT_CONFIG_GLOBAL: /dev/null
          GIT_CONFIG_NOSYSTEM: "1"
        run: |
          if ! stat -c %d:%i "$GITHUB_WORKSPACE" "$GITHUB_WORKSPACE/.git" | cmp -s - "$RUNNER_TEMP/baseline/workspace"; then
            echo "The workspace or its .git isn't the one the session started in, so no git runs on it."
            exit 1
          fi
          if ! cmp -s .git/config "$RUNNER_TEMP/baseline/git-config"; then
            echo "Git's config changed during the session, so no git runs on the tree."
            exit 1
          fi
          # node_modules counts too: a session may write there, apart from its .bin.
          if [ -n "$(find . -mindepth 2 -name .git -print -quit)" ]; then
            echo "The session left a repository nested in the tree, whose config git would read, so no git runs on it."
            exit 1
          fi
          out="$RUNNER_TEMP/sessions/build/out"
          # Made afresh, so nothing a session put there goes into the artifact.
          change="$RUNNER_TEMP/change"
          rm -rf "$change"
          mkdir "$change"
          git -c core.hooksPath=/dev/null -c core.fsmonitor=false -c diff.external= add -A
          git -c core.hooksPath=/dev/null -c core.fsmonitor=false -c diff.external= diff --cached --binary --no-ext-diff --no-textconv > "$change/change.patch"
          for file in message.md pull-request.md pictures.json; do
            if [ -f "$out/$file" ] && [ ! -L "$out/$file" ]; then cp "$out/$file" "$change/"; fi
          done
          if [ -s "$change/change.patch" ]; then
            echo "changed=true" >> "$GITHUB_OUTPUT"
          else
            echo "Claude changed nothing."
            echo "changed=false" >> "$GITHUB_OUTPUT"
          fi
          pages="$change/pictures.json"
          if [ -s "$change/change.patch" ] && [ -f "$pages" ] && ! jq -e 'type == "array" and length == 0' "$pages" > /dev/null 2>&1; then
            echo "pictures=true" >> "$GITHUB_OUTPUT"
          else
            echo "pictures=false" >> "$GITHUB_OUTPUT"
          fi

      # The artifact is public, so a change that carries anything like the login token isn't kept.
      # Its digest is the job's output, which later jobs check the artifact against.
      - name: Keep the change, with its digest
        id: pack
        run: |
          # Only regular files are kept: a link a session planted would be uploaded as what it points at.
          if [ -n "$(find "$RUNNER_TEMP/change" ! -type f ! -type d -print -quit)" ]; then
            echo "The change folder holds something other than files, so nothing is kept."
            exit 1
          fi
          bash "$RUNNER_TEMP/main/scan-tokens.sh" "$RUNNER_TEMP/change"
          digest() { (cd "$1" && find . -type f -print0 | LC_ALL=C sort -z | xargs -0 -r sha256sum) | sha256sum | cut -c 1-64; }
          echo "digest=$(digest "$RUNNER_TEMP/change")" >> "$GITHUB_OUTPUT"

      # Kept for 30 days, so a draft that's offered rather than pushed can be downloaded.
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: change
          path: ${{ runner.temp }}/change
          retention-days: 30

  # Runs the registry itself, from main and from the change, with a token that can only read and no
  # secret, and the open job checks every picture it hands back.
  pictures:
    needs: draft
    if: needs.draft.outputs.changed == 'true' && needs.draft.outputs.pictures == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
    outputs:
      digest: ${{ steps.pack.outputs.digest }}
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      # The change's code runs in this job, so it neither saves npm's cache nor restores one.
      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5.0.0
        with:
          node-version: 22
          package-manager-cache: false
      - run: npm ci

      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: change
          path: ${{ runner.temp }}/change
      - name: Check the change is the draft's
        env:
          CHANGE_DIGEST: ${{ needs.draft.outputs.digest }}
        run: |
          digest() { (cd "$1" && find . -type f -print0 | LC_ALL=C sort -z | xargs -0 -r sha256sum) | sha256sum | cut -c 1-64; }
          if [ "$(digest "$RUNNER_TEMP/change")" != "$CHANGE_DIGEST" ]; then
            echo "The change isn't the one the draft made."
            exit 1
          fi

      # The script applies the change to this checkout part way through, so main's copies run from
      # outside it, the same for both sides.
      - name: Take the picture scripts from main
        run: cp .github/picture-pages.sh .github/picture-pages.mjs "$RUNNER_TEMP/"

      - name: Picture the pages before and after
        env:
          CHROME: /usr/bin/google-chrome
        run: |
          stop="$(openssl rand -hex 16)"
          echo "::stop-commands::$stop"
          bash "$RUNNER_TEMP/picture-pages.sh" "$RUNNER_TEMP/change/pictures.json" \
            "$RUNNER_TEMP/change/change.patch" "$RUNNER_TEMP/pictures"
          echo "::$stop::"

      - name: Take the pictures' digest
        id: pack
        run: |
          digest() { (cd "$1" && find . -type f -print0 | LC_ALL=C sort -z | xargs -0 -r sha256sum) | sha256sum | cut -c 1-64; }
          echo "digest=$(digest "$RUNNER_TEMP/pictures")" >> "$GITHUB_OUTPUT"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: pictures
          path: ${{ runner.temp }}/pictures

  # Pushes the branch and the pictures and opens the pull request. It runs none of the proposed code
  # and installs nothing. It applies the patch to main as it is now, not the main the draft started
  # from, so a change that landed on main meanwhile isn't pushed back as part of this one. A draft
  # touching .github/ or Claude Code's own files is offered instead, a patch that no longer applies
  # is said so, and a draft that changed nothing posts Claude's message, which may be a question for
  # the maintainer: each in a new comment, and the build stops.
  open:
    needs: [draft, pictures]
    if: ${{ !cancelled() && needs.draft.result == 'success' }}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    # The Actions token only reads and comments here. The app's token pushes and opens.
    permissions:
      contents: read
      issues: write
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          ref: main
          persist-credentials: false

      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: change
          path: ${{ runner.temp }}/change
      - name: Check the change is the draft's
        env:
          CHANGE_DIGEST: ${{ needs.draft.outputs.digest }}
        run: |
          digest() { (cd "$1" && find . -type f -print0 | LC_ALL=C sort -z | xargs -0 -r sha256sum) | sha256sum | cut -c 1-64; }
          if [ "$(digest "$RUNNER_TEMP/change")" != "$CHANGE_DIGEST" ]; then
            echo "The change isn't the one the draft made."
            exit 1
          fi

      # Claude's message is posted escaped: < escaped, mentions broken, length capped.
      - name: Say what Claude said when it changed nothing
        id: nothing
        if: needs.draft.outputs.changed != 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          run_url="$GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID"
          {
            echo "**The build changed nothing.**"
            echo
            if [ -s "$RUNNER_TEMP/change/message.md" ]; then
              echo "Claude left the code as it was, and said why:"
              echo
              jq -jRs 'gsub("<"; "&lt;") | gsub("@(?=[A-Za-z0-9])"; "@​") | .[0:10000]' "$RUNNER_TEMP/change/message.md"
              echo
            else
              echo "Claude left the code as it was, and left no message saying why."
            fi
            echo
            echo "To try again once the issue says more, remove the build label and add it again. [The run]($run_url)"
          } > "$RUNNER_TEMP/nothing.md"
          gh issue comment "$ISSUE" --repo "$GITHUB_REPOSITORY" --body-file "$RUNNER_TEMP/nothing.md"

      # Sorted by git alone. Main's script for the description is copied out first, since once the
      # patch is applied the workspace holds the change's code. The app may not push a workflow, and
      # no session loads Claude Code's own files from a branch, so a draft touching either is
      # offered in a new comment from fixed text, quoting none of it.
      - name: Apply the change to main as it is now, and sort it by the files it touches
        id: guard
        if: needs.draft.outputs.changed == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          run_url="$GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID"
          cp .github/pull-request-body.sh .github/unclose.sh "$RUNNER_TEMP/"
          if ! git -c core.hooksPath=/dev/null apply --index "$RUNNER_TEMP/change/change.patch"; then
            {
              echo "**The build's change no longer applies to main as it is now, so it wasn't pushed.**"
              echo
              echo "To build it again on top of main, remove the build label and add it again. [The run]($run_url)"
            } > "$RUNNER_TEMP/stale.md"
            gh issue comment "$ISSUE" --repo "$GITHUB_REPOSITORY" --body-file "$RUNNER_TEMP/stale.md"
            echo "result=stale" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          guarded='^\.github/|(^|/)\.claude(/|$)|(^|/)\.mcp\.json$|(^|/)CLAUDE(\.local)?\.md$|(^|/)\.npmrc$|(^|/)\.yarnrc[^/]*$|(^|/)node_modules(/|$)|(^|/)npm-shrinkwrap\.json$|(^|/)yarn\.lock$'
          # A symbolic link is read wherever it's followed, so the app never pushes one either.
          links="$(git diff --cached --raw --no-renames | awk '$2 == "120000" { found = 1 } END { if (found) print "link" }')"
          if [ -n "$links" ] || git diff --cached --name-only --no-renames -z | grep -zE "$guarded" > /dev/null; then
            # The names are the draft's, so they're printed as JSON, where none can start a workflow
            # command.
            git diff --cached --name-only --no-renames -z | { grep -zE "$guarded" || true; } | jq -Rs 'split("\u0000") | map(select(. != ""))'
            {
              echo "**The build's draft changes files the app never pushes, so it didn't push it.** The app holds back:"
              echo
              echo "- \`.github/\`: the app may not change a workflow."
              echo "- Claude Code's own files, \`.claude/\`, \`.mcp.json\` or a \`CLAUDE.md\`: no session loads Claude Code's settings, servers or instructions from a branch."
              echo "- An \`.npmrc\`, a \`.yarnrc\`, an \`npm-shrinkwrap.json\`, a \`yarn.lock\` or \`node_modules/\`: an install of the branch would read them."
              echo "- A symbolic link: a symbolic link is read wherever it's followed."
              echo
              echo "To look at the draft and apply it yourself, from a checkout of main:"
              echo
              echo '```'
              echo "gh run download $GITHUB_RUN_ID --repo $GITHUB_REPOSITORY -n change -D change"
              echo "git apply --index change/change.patch"
              echo '```'
              echo
              echo "The run keeps the draft for 30 days. [The run]($run_url)"
            } > "$RUNNER_TEMP/offer.md"
            gh issue comment "$ISSUE" --repo "$GITHUB_REPOSITORY" --body-file "$RUNNER_TEMP/offer.md"
            echo "result=offer" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          echo "result=push" >> "$GITHUB_OUTPUT"

      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        if: steps.guard.outputs.result == 'push' && needs.pictures.result == 'success'
        with:
          name: pictures
          path: ${{ runner.temp }}/pictures

      # The pictures job ran the change's own code, so its pictures are taken on trust only as far
      # as this: they must be the ones it gave the digest of, every field and path is checked, and
      # only PNG and GIF files under the size cap are kept. If any picture fails, all are left out
      # and the description says why, since the change itself is still good.
      - name: Check the pictures
        id: pictures
        if: steps.guard.outputs.result == 'push'
        env:
          PICTURES_JOB: ${{ needs.pictures.result }}
          PICTURES_DIGEST: ${{ needs.pictures.outputs.digest }}
        run: |
          digest() { (cd "$1" && find . -type f -print0 | LC_ALL=C sort -z | xargs -0 -r sha256sum) | sha256sum | cut -c 1-64; }
          if [ "$PICTURES_JOB" = success ] && [ "$(digest "$RUNNER_TEMP/pictures")" != "$PICTURES_DIGEST" ]; then
            PICTURES_JOB=replaced
          fi
          pictures="$RUNNER_TEMP/pictures/pictures"
          media="$RUNNER_TEMP/media"
          mkdir -p "$media"
          : > "$RUNNER_TEMP/pictures.txt"
          : > "$RUNNER_TEMP/pictures-left-out.txt"
          leave_out() {
            echo "::warning::$1"
            echo "$1" > "$RUNNER_TEMP/pictures-left-out.txt"
            : > "$RUNNER_TEMP/pictures.txt"
            rm -rf "$media"
            echo "count=0" >> "$GITHUB_OUTPUT"
            exit 0
          }
          safe_path() {
            case "$1" in ''|/*|*..*|*[!A-Za-z0-9._/-]*) return 1 ;; esac
          }
          safe_page() {
            case "$1" in /*) ;; *) return 1 ;; esac
            case "$1" in *..*|*[!A-Za-z0-9._~/?=\&%-]*) return 1 ;; esac
          }
          # A picture the job couldn't take is "", and is shown as such.
          take() {
            [ -n "$1" ] || return 0
            safe_path "$1" || return 1
            case "$1" in
              *.png) magic=89504e470d0a1a0a ;;
              *.gif) magic=474946383961 ;;
              *) return 1 ;;
            esac
            [ -f "$pictures/$1" ] && [ ! -L "$pictures/$1" ] || return 1
            [ "$(stat -c %s "$pictures/$1")" -le $((5 * 1024 * 1024)) ] || return 1
            [ "$(head -c $(( ${#magic} / 2 )) "$pictures/$1" | od -An -tx1 | tr -d ' \n')" = "$magic" ] || return 1
            mkdir -p "$(dirname "$media/$1")"
            cp "$pictures/$1" "$media/$1"
          }
          case "$PICTURES_JOB" in
            skipped) echo "count=0" >> "$GITHUB_OUTPUT"; exit 0 ;;
            success) ;;
            *) leave_out "The pictures job didn't finish, so no page was pictured." ;;
          esac
          [ -f "$pictures/manifest.json" ] || leave_out "The pictures job made no manifest."
          # A bar can't be in a checked field, so it parts the fields where a tab, being blank, wouldn't.
          rows="$(jq -r '
            if type == "array" and all(.[]; type == "object" and
                ([.page, .as, .width, .before, .after] | all(type == "string" and test("^[A-Za-z0-9._~/?=&%-]*$"))))
            then .[] | [.page, .as, .width, .before, .after] | join("|")
            else error("not a list of pictures") end
          ' "$pictures/manifest.json")" || leave_out "The pictures' manifest could not be read."
          count=0
          while IFS='|' read -r page as width before after; do
            [ -n "$page$as$width$before$after" ] || continue
            safe_page "$page" || leave_out "The pictures' manifest names a page that isn't a plain path."
            case "$as" in visitor|owner) ;; *) leave_out "The pictures' manifest names a viewer other than visitor or owner." ;; esac
            case "$width" in desktop|phone) ;; *) leave_out "The pictures' manifest names a width other than desktop or phone." ;; esac
            take "$before" || leave_out "A before picture of \`$page\` isn't a PNG or GIF under 5 MB at a plain path."
            take "$after" || leave_out "An after picture of \`$page\` isn't a PNG or GIF under 5 MB at a plain path."
            [ -z "$before" ] || count=$((count + 1))
            [ -z "$after" ] || count=$((count + 1))
            [ "$count" -le 80 ] || leave_out "There are more than 80 pictures, too many to show."
            printf '%s|%s|%s|%s|%s\n' "$page" "$as" "$width" "$before" "$after" >> "$RUNNER_TEMP/pictures.txt"
          done <<< "$rows"
          echo "count=$count" >> "$GITHUB_OUTPUT"

      - name: Make the app's token
        id: app
        if: steps.guard.outputs.result == 'push'
        uses: actions/create-github-app-token@d72941d797fd3113feb6b93fd0dec494b13a2547 # v1.12.0
        with:
          app-id: ${{ secrets.FACTORY_APP_ID }}
          private-key: ${{ secrets.FACTORY_APP_KEY }}
          owner: ${{ github.repository_owner }}
          repositories: ${{ github.event.repository.name }}

      # The commit is the app's, as its push is, so land knows it as the factory's.
      - name: Commit the change as the app's bot
        id: commit
        if: steps.guard.outputs.result == 'push'
        env:
          APP_SLUG: ${{ steps.app.outputs.app-slug }}
          GH_TOKEN: ${{ github.token }}
        run: |
          # Land knows the factory's commits by the app's bot, awml-factory[bot], as every workflow
          # names it, so an app of any other name is refused.
          if ! [ "$APP_SLUG" = awml-factory ]; then
            echo "The factory's app must be awml-factory, not $APP_SLUG."
            exit 1
          fi
          id="$(gh api "users/awml-factory%5Bbot%5D" --jq .id)"
          case "$id" in ''|*[!0-9]*) echo "The app's bot has no id: $id"; exit 1 ;; esac
          message="$RUNNER_TEMP/commit.md"
          # Claude's message closes no issue: only the build's own Closes #n does.
          if [ -f "$RUNNER_TEMP/change/message.md" ]; then
            bash "$RUNNER_TEMP/unclose.sh" < "$RUNNER_TEMP/change/message.md" > "$message"
          fi
          [ -s "$message" ] || echo "Build #$ISSUE" > "$message"
          printf '\n\nCloses #%s\n' "$ISSUE" >> "$message"
          git config user.name "awml-factory[bot]"
          git config user.email "$id+awml-factory[bot]@users.noreply.github.com"
          git -c core.hooksPath=/dev/null switch -c "build/issue-$ISSUE"
          git -c core.hooksPath=/dev/null commit -q -F "$message"

      - name: Write the pull request's description
        id: describe
        if: steps.guard.outputs.result == 'push'
        env:
          CHANGE_DIR: ${{ runner.temp }}/change
          PICTURES: ${{ runner.temp }}/pictures.txt
          PICTURES_LEFT_OUT: ${{ runner.temp }}/pictures-left-out.txt
        run: |
          export MEDIA_URL="$GITHUB_SERVER_URL/$GITHUB_REPOSITORY/raw/factory-media/issue-$ISSUE/run-$GITHUB_RUN_ID"
          bash "$RUNNER_TEMP/pull-request-body.sh" > "$RUNNER_TEMP/pull-request.md"
          title="$(head -n 1 "$RUNNER_TEMP/change/message.md" | bash "$RUNNER_TEMP/unclose.sh" | cut -c 1-200 || true)"
          [ -n "$title" ] || title="Build #$ISSUE"
          printf '%s\n' "$title" > "$RUNNER_TEMP/title.txt"

      # CI's run for the push reads the pull request as it is when the push lands, so an open pull
      # request gets this try's title and description first. gh pr view finds a branch's closed or
      # merged pull request when it has no open one, so only GitHub's list of the branch's open pull
      # requests decides, and only the app's: anyone can open one from the branch.
      - name: Give an open pull request this try's title and description, before the push
        id: edit
        if: steps.guard.outputs.result == 'push'
        env:
          BRANCH: build/issue-${{ env.ISSUE }}
          GH_TOKEN: ${{ steps.app.outputs.token }}
        run: |
          number="$(gh api "repos/$GITHUB_REPOSITORY/pulls?head=$GITHUB_REPOSITORY_OWNER:$BRANCH&base=main&state=open" \
            --jq '[.[] | select(.user.login == "awml-factory[bot]" and .user.type == "Bot") | .number] | first // empty')"
          case "$number" in *[!0-9]*) echo "The open pull request's number isn't a number: $number"; exit 1 ;; esac
          if [ -n "$number" ]; then
            gh pr edit "$number" --repo "$GITHUB_REPOSITORY" --title "$(cat "$RUNNER_TEMP/title.txt")" \
              --body-file "$RUNNER_TEMP/pull-request.md"
          fi

      # The branch is reused, so a new try's push replaces it and updates the open pull request,
      # which CI then judges. The push is leased on the head this step read, or on there being no
      # branch, so GitHub refuses it if anyone pushed meanwhile.
      - name: Push the branch
        id: push
        if: steps.guard.outputs.result == 'push'
        env:
          GH_TOKEN: ${{ steps.app.outputs.token }}
        run: |
          branch="build/issue-$ISSUE"
          auth="AUTHORIZATION: basic $(printf 'x-access-token:%s' "$GH_TOKEN" | base64 -w0)"
          old="$(git -c core.hooksPath=/dev/null -c http.https://github.com/.extraheader="$auth" \
            ls-remote origin "refs/heads/$branch" | cut -f 1)"
          [[ "$old" =~ ^([0-9a-f]{40})?$ ]] || { echo "The branch's head isn't a commit id: $old"; exit 1; }
          git -c core.hooksPath=/dev/null -c http.https://github.com/.extraheader="$auth" \
            push --force-with-lease="refs/heads/$branch:$old" origin "HEAD:refs/heads/$branch"

      # The pictures go to the factory-media branch, which holds nothing else and shares no history
      # with main. Each run adds a commit with its own folder, so the links in older descriptions
      # keep working.
      - name: Push the pictures to the factory-media branch
        id: media
        if: steps.guard.outputs.result == 'push' && steps.pictures.outputs.count != '0'
        env:
          GH_TOKEN: ${{ steps.app.outputs.token }}
        run: |
          auth="AUTHORIZATION: basic $(printf 'x-access-token:%s' "$GH_TOKEN" | base64 -w0)"
          export GIT_INDEX_FILE="$RUNNER_TEMP/media.index"
          parent=""
          status=0
          git -c http.https://github.com/.extraheader="$auth" \
            ls-remote --exit-code origin refs/heads/factory-media > /dev/null || status=$?
          case "$status" in
            0)
              git -c http.https://github.com/.extraheader="$auth" \
                fetch --no-tags --depth=1 origin refs/heads/factory-media
              parent="$(git rev-parse FETCH_HEAD)"
              git read-tree "$parent"
              ;;
            2) git read-tree --empty ;;
            *) echo "Could not read the factory-media branch."; exit 1 ;;
          esac
          (cd "$RUNNER_TEMP/media" && find . -type f \( -name '*.png' -o -name '*.gif' \) | sed 's|^\./||') |
          while IFS= read -r path; do
            blob="$(git hash-object -w "$RUNNER_TEMP/media/$path")"
            git update-index --add --cacheinfo "100644,$blob,issue-$ISSUE/run-$GITHUB_RUN_ID/$path"
          done
          tree="$(git write-tree)"
          commit="$(git commit-tree "$tree" ${parent:+-p "$parent"} \
            -m "Pictures for #$ISSUE, run $GITHUB_RUN_ID")"
          git -c core.hooksPath=/dev/null -c http.https://github.com/.extraheader="$auth" \
            push origin "$commit:refs/heads/factory-media"

      # A branch with no open pull request gets one now, once its commit is pushed.
      - name: Open the pull request, unless one is open from the branch
        id: pull
        if: steps.guard.outputs.result == 'push'
        env:
          BRANCH: build/issue-${{ env.ISSUE }}
          GH_TOKEN: ${{ steps.app.outputs.token }}
        run: |
          number="$(gh api "repos/$GITHUB_REPOSITORY/pulls?head=$GITHUB_REPOSITORY_OWNER:$BRANCH&base=main&state=open" \
            --jq '[.[] | select(.user.login == "awml-factory[bot]" and .user.type == "Bot") | .number] | first // empty')"
          case "$number" in *[!0-9]*) echo "The open pull request's number isn't a number: $number"; exit 1 ;; esac
          if [ -z "$number" ]; then
            gh pr create --repo "$GITHUB_REPOSITORY" --base main --head "$BRANCH" \
              --title "$(cat "$RUNNER_TEMP/title.txt")" --body-file "$RUNNER_TEMP/pull-request.md"
          fi

  # Says in a new comment when the build stopped before it opened anything, since nothing was pushed
  # for CI to fail and retry.yml won't hear of it. Pictures that fail are left out, and stop nothing.
  stopped:
    needs: [start, draft, pictures, open]
    if: ${{ failure() && needs.start.outputs.go == 'true' }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      issues: write
    steps:
      - name: Say the build stopped
        env:
          GH_TOKEN: ${{ github.token }}
          DRAFT: ${{ needs.draft.result }}
          OPEN: ${{ needs.open.result }}
        run: |
          if [ "$DRAFT" = success ] && [ "$OPEN" = success ]; then
            echo "Only the pictures failed, and the pull request went ahead without them."
            exit 0
          fi
          run_url="$GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID"
          {
            echo "**The build stopped before it opened a pull request.** The run says which step failed."
            echo
            echo "To try again, remove the build label and add it again. [The run]($run_url)"
          } > "$RUNNER_TEMP/stopped.md"
          gh issue comment "$ISSUE" --repo "$GITHUB_REPOSITORY" --body-file "$RUNNER_TEMP/stopped.md"
