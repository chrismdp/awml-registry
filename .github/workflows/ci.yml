# Type checks, lints and tests every push and pull request. The factory pushes and merges through
# the repository's GitHub App, and GitHub starts this workflow from what an app does, so it runs on
# the factory's branches and on main after a merge with no help. Deploying is up to whoever runs a
# registry: scripts/deploy.sh deploys to Cloudflare.
#
# When a check fails on main, a last job reports it. This is the workflow drawn at
# https://awml.io/chrismdp/fix-failing-main. If an issue labelled failing-main is already open, it
# adds this run to that issue and starts nothing, so a main that fails on several pushes starts one
# build. Otherwise the app opens an issue with the end of the failing output, labelled failing-main
# and build, and GitHub starts the build from that label as it would from a person's. The build
# retries and merges by the same rules as any other. The report job checks out nothing and runs none
# of the code it reports on: it reads the failed jobs' log with gh. It reads and comments with the
# Actions token, and mints the app's token, for this repository alone, only to open the issue. That
# needs the FACTORY_APP_ID and FACTORY_APP_KEY secrets, the app installed on this repository with
# read and write access to issues, and the failing-main and build labels.
name: CI

on:
  push:
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm run lint
      - run: npm test

  report:
    needs: test
    if: failure() && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      actions: read
      contents: read
      issues: write
    steps:
      - name: Report the failure on an open issue, or write a new one
        id: report
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          here="$RUNNER_TEMP/report"
          mkdir -p "$here"
          run_url="$GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID"

          # The run is still going, so each failed job's log is read on its own. If gh won't show
          # the failed steps of a job in a run that hasn't finished, the job's whole log stands in.
          gh api "repos/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID/jobs" --paginate \
            --jq '.jobs[] | select(.conclusion == "failure") | .id' > "$here/jobs.txt"
          while IFS= read -r job; do
            gh run view --repo "$GITHUB_REPOSITORY" --job "$job" --log-failed \
              || gh api "repos/$GITHUB_REPOSITORY/actions/jobs/$job/logs"
          done < "$here/jobs.txt" > "$here/log.txt"
          tail -n 150 "$here/log.txt" > "$here/output.txt"

          longest="$(grep -o '`*' "$here/output.txt" | awk '{ if (length($0) > m) m = length($0) } END { print m + 0 }')"
          fence="$(printf '%*s' "$(( longest >= 3 ? longest + 1 : 3 ))" '' | tr ' ' '`')"
          subject="$(gh api "repos/$GITHUB_REPOSITORY/commits/$GITHUB_SHA" --jq .commit.message | head -n 1)"
          {
            echo "The checks failed on main at $GITHUB_SHA, \"$subject\"."
            echo
            echo "The run: $run_url"
            echo
            echo "$fence"
            cat "$here/output.txt"
            echo "$fence"
          } > "$here/failure.md"

          open="$(gh issue list --repo "$GITHUB_REPOSITORY" --label failing-main --state open \
            --json number --jq '.[0].number // empty')"
          if [ -n "$open" ]; then
            gh issue comment "$open" --repo "$GITHUB_REPOSITORY" --body-file "$here/failure.md"
            echo "open=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          if [ "${#subject}" -gt 60 ]; then
            subject="${subject:0:57}..."
          fi
          {
            cat "$here/failure.md"
            echo
            echo "A build of this issue has started. A fix the build rule finds straightforward merges by itself."
          } > "$here/issue.md"
          printf 'Main is failing: %s\n' "$subject" > "$here/title.txt"
          echo "open=false" >> "$GITHUB_OUTPUT"

      - name: Mint the app's token
        id: app
        if: steps.report.outputs.open == 'false'
        uses: actions/create-github-app-token@v1
        with:
          app-id: ${{ secrets.FACTORY_APP_ID }}
          private-key: ${{ secrets.FACTORY_APP_KEY }}
          owner: ${{ github.repository_owner }}
          repositories: ${{ github.event.repository.name }}

      # The app opens the issue, so GitHub starts the build from its build label.
      - name: Open an issue labelled build
        if: steps.report.outputs.open == 'false'
        env:
          GH_TOKEN: ${{ steps.app.outputs.token }}
        run: |
          here="$RUNNER_TEMP/report"
          if ! url="$(gh issue create --repo "$GITHUB_REPOSITORY" --title "$(cat "$here/title.txt")" \
            --label failing-main --label build --body-file "$here/issue.md")"; then
            echo "::error::Could not open an issue about the failing main. Check that the failing-main and build labels exist."
            exit 1
          fi
          echo "Opened $url"
