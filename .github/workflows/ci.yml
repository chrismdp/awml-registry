# Type checks, lints and tests every push and pull request. The build workflow also starts it by
# dispatch after it pushes a branch or merges a change, because pushes and merges by the Actions
# token start no other workflow. Deploying is up to whoever runs a registry: scripts/deploy.sh
# deploys to Cloudflare.
name: CI

on:
  push:
  pull_request:
  # The factory starts this by hand, because pushes made with the Actions token start nothing.
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm run lint
      - run: npm test
