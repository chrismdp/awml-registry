# Type checks, lints and tests every push and pull request. Deploying is up to
# whoever runs a registry: scripts/deploy.sh deploys to Cloudflare.
name: CI

on:
  push:
  pull_request:
  # The factory starts this by hand, because pushes made with the Actions token start nothing.
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm run lint
      - run: npm test
