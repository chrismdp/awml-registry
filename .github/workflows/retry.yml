# The factory's retry, drawn in .github/drawings/retry-a-build.yaml (A failed build tries again).
# When CI's tests fail on a build's pull request, whatever else failed, this starts the build again
# for the branch's issue, up to three builds since the label was last added. The tests own a run
# where both they and a review failed, so this acts then and the fixer doesn't, and a fix commit
# that breaks a test lands here too. It reads GitHub, the CI run that woke it, the pull request, the
# build runs named for the issue, the label's events and the issue's last edit, and the branch's
# commits with git. It hands the build nothing but the issue's number, and the build reads why the
# last try failed from CI itself. After three builds, or if the issue was edited since the label went
# on, a new comment on the issue says a person must act.
#
# A commit on the branch since main that isn't the factory's, or a merge, means that
# a person has taken it over. The build won't redraft over their work, and one new comment on the
# issue says so, posted by the first run whose tests failed on a head that held such a commit, by
# GitHub's record of each earlier run's commits.
name: Retry a build

# GitHub runs this from main's copy. It checks out main to read the branch's commits with git, and
# runs nothing from the branch. The Actions token
# starts the build, which GitHub allows for workflow_dispatch, and comments. It needs what build.yml
# lists.
on:
  workflow_run:
    workflows: [CI]
    types: [completed]
    branches: ["build/issue-*"]

# No concurrency group: GitHub keeps one run waiting in a group and cancels it for a newer one
# whatever cancel-in-progress says, so a run started by someone else's pull request from a branch of
# the same name could displace the real one. None is needed: a run acts only for CI's run at the
# head of the open pull request it reads, starts a build only on that run's first attempt, and
# works out from earlier runs whether each of its comments was already posted.

jobs:
  retry:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      actions: write
      contents: read
      issues: write
      pull-requests: read
    steps:
      # main, to read the branch's commits against with git. Nothing from it runs.
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          ref: main
          fetch-depth: 0
          persist-credentials: false

      # Only a pull_request run, which runs once a commit, from a branch of this repository, since a
      # fork's branch can carry a build's name, at the head of the branch's open pull request. A try
      # is a build.yml run for the issue, by its name, since the build label was last added; the
      # fixer's and the rebase's pushes don't count. Nothing is carried from one run to the next.
      - name: Count the builds since the label, and start another or say a person must act
        id: tries
        env:
          GH_TOKEN: ${{ github.token }}
          BRANCH: ${{ github.event.workflow_run.head_branch }}
          HEAD_SHA: ${{ github.event.workflow_run.head_sha }}
          HEAD_REPOSITORY: ${{ github.event.workflow_run.head_repository.full_name }}
          CI_EVENT: ${{ github.event.workflow_run.event }}
          CI_RUN: ${{ github.event.workflow_run.id }}
          RUN_ATTEMPT: ${{ github.event.workflow_run.run_attempt }}
        run: |
          # Whether GitHub says someone may write to the repository: their role or its base permission is
          # exactly admin, maintain or write, so a custom role counts only by what it grants.
          may_write() {
            [[ "$1" =~ ^[A-Za-z0-9-]{1,39}$ ]] || return 1
            local role="" permission=""
            IFS=$'\t' read -r role permission < <(gh api "repos/$GITHUB_REPOSITORY/collaborators/$1/permission" --jq '[.role_name // "", .permission // ""] | @tsv' || true) || true
            case "$role" in admin|maintain|write) return 0 ;; esac
            case "$permission" in admin|maintain|write) return 0 ;; esac
            return 1
          }
          leave() { echo "$1"; exit 0; }
          # Whether an earlier CI pull_request run on the branch, from this repository, created since
          # the given time, had failed tests, and so said what this run would say.
          told_since() {
            gh api --paginate "repos/$GITHUB_REPOSITORY/actions/workflows/ci.yml/runs?branch=$BRANCH&event=pull_request&created=>=$1&per_page=100" |
              jq -rs --arg repository "$GITHUB_REPOSITORY" --argjson run "$CI_RUN" \
                '[.[].workflow_runs[] | select(.event == "pull_request" and .head_repository.full_name == $repository
                  and .conclusion == "failure" and .id < $run) | .id] | .[]' > "$RUNNER_TEMP/earlier.txt"
            while read -r earlier; do
              case "$earlier" in ''|*[!0-9]*) continue ;; esac
              if gh api "repos/$GITHUB_REPOSITORY/actions/runs/$earlier/jobs" --paginate --jq '.jobs[]' |
                jq -se 'any(.[]; .name == "test" and .conclusion == "failure")' > /dev/null; then
                return 0
              fi
            done < "$RUNNER_TEMP/earlier.txt"
            return 1
          }
          # Whether an earlier CI pull_request run on the branch, from this repository, had failed
          # tests on a head that already held a commit since main that isn't the factory's, by
          # GitHub's record of that head's commits, and so said a person had taken it over.
          told_taken() {
            gh api --paginate "repos/$GITHUB_REPOSITORY/actions/workflows/ci.yml/runs?branch=$BRANCH&event=pull_request&per_page=100" |
              jq -rs --arg repository "$GITHUB_REPOSITORY" --argjson run "$CI_RUN" \
                '.[].workflow_runs[] | select(.event == "pull_request" and .head_repository.full_name == $repository
                  and .conclusion == "failure" and .id < $run) | "\(.id)\t\(.head_sha)"' > "$RUNNER_TEMP/earlier-heads.txt"
            while IFS=$'\t' read -r earlier earlier_head; do
              case "$earlier" in ''|*[!0-9]*) continue ;; esac
              [[ "$earlier_head" =~ ^[0-9a-f]{40}$ ]] || continue
              gh api "repos/$GITHUB_REPOSITORY/actions/runs/$earlier/jobs" --paginate --jq '.jobs[]' |
                jq -se 'any(.[]; .name == "test" and .conclusion == "failure")' > /dev/null || continue
              if gh api "repos/$GITHUB_REPOSITORY/compare/main...$earlier_head" |
                jq -e --arg factory "$factory" 'any(.commits[]; (.parents | length) > 1 or
                  (.commit.author.email | test($factory) | not) or (.commit.committer.email | test($factory) | not))' > /dev/null; then
                return 0
              fi
            done < "$RUNNER_TEMP/earlier-heads.txt"
            return 1
          }
          [ "$HEAD_REPOSITORY" = "$GITHUB_REPOSITORY" ] && [ "$CI_EVENT" = pull_request ] ||
            leave "CI didn't run on a pull request from a branch of this repository."
          case "$BRANCH" in build/issue-*) issue="${BRANCH#build/issue-}" ;; *) leave "This isn't a build's branch." ;; esac
          case "$issue" in ''|*[!0-9]*) leave "This isn't a build's branch." ;; esac
          [[ "$HEAD_SHA" =~ ^[0-9a-f]{40}$ ]] || leave "CI's commit isn't a commit id."
          case "$CI_RUN" in ''|*[!0-9]*) leave "CI's run isn't a number." ;; esac
          gh api "repos/$GITHUB_REPOSITORY/actions/runs/$CI_RUN/jobs" --paginate --jq '.jobs[]' | jq -s . > "$RUNNER_TEMP/jobs.json"
          jq -e 'any(.[]; .name == "test" and .conclusion == "failure")' "$RUNNER_TEMP/jobs.json" > /dev/null ||
            leave "CI's tests didn't fail."
          pr="$(gh api "repos/$GITHUB_REPOSITORY/pulls?head=$GITHUB_REPOSITORY_OWNER:$BRANCH&base=main&state=open" |
            jq -r --arg repository "$GITHUB_REPOSITORY" --arg branch "$BRANCH" --arg head "$HEAD_SHA" \
              '[.[] | select(.head.ref == $branch and .head.repo.full_name == $repository and .head.sha == $head
                and .user.login == "awml-factory[bot]" and .user.type == "Bot")]
                | first | .number // empty')"
          [ -n "$pr" ] || leave "No open pull request on $BRANCH is at CI's commit, so a newer CI result decides."
          # A stranger's pull request from the branch, at the same head, gets a CI run of its own,
          # whose pull_requests still lists this one. So the run must list this pull request, by
          # GitHub's record of the run, and must have been started by the factory's app, by its exact
          # login and type, or by someone GitHub says may write to the repository.
          gh api "repos/$GITHUB_REPOSITORY/actions/runs/$CI_RUN" > "$RUNNER_TEMP/run.json"
          jq -e --argjson pr "$pr" 'any(.pull_requests[]?; .number == $pr)' "$RUNNER_TEMP/run.json" > /dev/null ||
            leave "CI's run isn't #$pr's own."
          actor="$(jq -r '.triggering_actor.login // ""' "$RUNNER_TEMP/run.json")"
          actor_type="$(jq -r '.triggering_actor.type // ""' "$RUNNER_TEMP/run.json")"
          if ! { [ "$actor" = "awml-factory[bot]" ] && [ "$actor_type" = Bot ]; }; then
            may_write "$actor" || leave "CI's run was started by someone who may not write here."
          fi

          # A commit since main that isn't the factory's, by the build rule's test of its author's
          # and committer's emails, or a merge, means a person has taken the branch on: the build
          # doesn't redraft over their work. Read with git, from main's clone with the head fetched in.
          safe_git() { GIT_CONFIG_GLOBAL=/dev/null GIT_CONFIG_NOSYSTEM=1 command git -c core.hooksPath=/dev/null -c core.fsmonitor=false -c diff.external= "$@"; }
          GIT_CONFIG_COUNT=1 GIT_CONFIG_KEY_0=http.https://github.com/.extraheader \
            GIT_CONFIG_VALUE_0="AUTHORIZATION: basic $(printf 'x-access-token:%s' "$GH_TOKEN" | base64 -w0)" \
            safe_git fetch -q --no-tags origin "$HEAD_SHA"
          base="$(safe_git merge-base HEAD "$HEAD_SHA")"
          factory='^[0-9]+\+awml-factory\[bot\]@users\.noreply\.github\.com$'
          taken="$(safe_git log --format='%P%x09%ae%x09%ce%x09%H' "$base..$HEAD_SHA" |
            FACTORY="$factory" awk -F '\t' 'split($1, parents, " ") > 1 || $2 !~ ENVIRON["FACTORY"] || $3 !~ ENVIRON["FACTORY"] { taken = $4 } END { print taken }')"

          # shellcheck disable=SC2016 # The query's variables are GraphQL's.
          gh api graphql -F owner="$GITHUB_REPOSITORY_OWNER" -f name="${GITHUB_REPOSITORY#*/}" -F number="$issue" -f query='
            query($owner: String!, $name: String!, $number: Int!) {
              repository(owner: $owner, name: $name) {
                issue(number: $number) {
                  lastEditedAt
                  labels(first: 100) { nodes { name } }
                  timelineItems(itemTypes: [LABELED_EVENT, RENAMED_TITLE_EVENT], last: 100) {
                    nodes { __typename ... on LabeledEvent { createdAt label { name } } ... on RenamedTitleEvent { createdAt } }
                  }
                }
              }
            }' > "$RUNNER_TEMP/issue.json"
          jq -e '.data.repository.issue.labels.nodes | any(.name == "build")' "$RUNNER_TEMP/issue.json" > /dev/null ||
            leave "The build label is off #$issue, so a person has stopped the build."
          labelled="$(jq -r '[.data.repository.issue.timelineItems.nodes[] | select(.label.name == "build") | .createdAt] | last // empty' "$RUNNER_TEMP/issue.json")"
          [[ "$labelled" =~ ^[0-9]{4}-[0-9]{2}-[0-9]{2}T[0-9:]{8}Z$ ]] || leave "Found no time the build label was added."
          # A new title doesn't change lastEditedAt, so a rename since the label counts as an edit too.
          edited="$(jq -r '.data.repository.issue | [.lastEditedAt // empty, (.timelineItems.nodes[] | select(.__typename == "RenamedTitleEvent") | .createdAt)] | max // empty' "$RUNNER_TEMP/issue.json")"

          run_url="$GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$CI_RUN"
          if [ -n "$taken" ]; then
            ! told_taken || leave "An earlier CI run's tests failed on a head a person had committed to, and that run said so."
            {
              echo "**CI's tests failed on #$pr, and a commit on its branch isn't the factory's, so a person has taken it over.** The build won't redraft over their work."
              echo
              echo "Whoever is working on the branch fixes it from here. [CI's run]($run_url)"
            } > "$RUNNER_TEMP/comment.md"
            gh issue comment "$issue" --repo "$GITHUB_REPOSITORY" --body-file "$RUNNER_TEMP/comment.md"
            exit 0
          fi
          if [ -n "$edited" ] && [[ "$edited" > "$labelled" ]]; then
            # Said once, as the other comments are: an earlier run whose tests failed since the edit
            # said it already.
            [[ "$edited" =~ ^[0-9]{4}-[0-9]{2}-[0-9]{2}T[0-9:]{8}Z$ ]] || leave "The issue's last edit has no time."
            ! told_since "$edited" || leave "An earlier CI run's tests failed since the issue was edited, and that run said so."
            {
              echo "**CI's tests failed on #$pr, and this issue was edited since the build label was last added, so the build won't try again from it.**"
              echo
              echo "To build it as it reads now, remove the build label and add it again. [CI's run]($run_url)"
            } > "$RUNNER_TEMP/comment.md"
            gh issue comment "$issue" --repo "$GITHUB_REPOSITORY" --body-file "$RUNNER_TEMP/comment.md"
            exit 0
          fi

          gh api --paginate "repos/$GITHUB_REPOSITORY/actions/workflows/build.yml/runs?branch=main&created=>=$labelled&per_page=100" |
            jq -s --arg title "Build of issue $issue" \
              '[.[].workflow_runs[] | select(.display_title == $title and .head_branch == "main"
                and (.event | IN("issues", "workflow_dispatch")))] | sort_by(.created_at)' > "$RUNNER_TEMP/builds.json"
          builds="$(jq length "$RUNNER_TEMP/builds.json")"
          echo "#$issue has had $builds builds since the label was last added."
          if [ "$builds" -lt 3 ]; then
            # A re-run of CI's run would start another build for the same failure.
            [ "$RUN_ATTEMPT" = 1 ] || leave "This is attempt $RUN_ATTEMPT of CI's run, so its first attempt has already started a build."
            gh workflow run build.yml --repo "$GITHUB_REPOSITORY" --ref main -f issue="$issue"
            exit 0
          fi

          # Said once: only by the first of CI's pull_request runs on the branch, from this
          # repository, whose tests failed after the third build started, found from GitHub's runs.
          third="$(jq -r '.[2].created_at' "$RUNNER_TEMP/builds.json")"
          [[ "$third" =~ ^[0-9]{4}-[0-9]{2}-[0-9]{2}T[0-9:]{8}Z$ ]] || leave "Found no time the third build started."
          ! told_since "$third" || leave "An earlier CI run's tests failed after the third build, and that run said a person must act."
          {
            echo "**CI's tests failed on #$pr, and the build has tried three times since the build label was added, so it has stopped.**"
            echo
            echo "A person must look at it. To start afresh, remove the build label and add it again. [CI's run]($run_url)"
          } > "$RUNNER_TEMP/comment.md"
          gh issue comment "$issue" --repo "$GITHUB_REPOSITORY" --body-file "$RUNNER_TEMP/comment.md"
