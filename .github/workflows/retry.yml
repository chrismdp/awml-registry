# The factory's retry, drawn in .github/drawings/retry-a-build.yaml (A failed build tries again).
# When CI's tests fail on a build's pull request, whatever else failed, this starts the build again
# for the branch's issue, up to three builds since the label was last added. The tests own a run
# where both they and a review failed, so this acts then and the fixer doesn't, and a fix commit
# that breaks a test lands here too. It reads only GitHub: the CI run that woke it, the pull request,
# the build runs named for the issue, the label's events and the issue's last edit. It hands the
# build nothing but the issue's number, and the build reads why the last try failed from CI itself.
# After three builds, or if the issue was edited since the label went on, a new comment on the issue
# says a person must act.
name: Retry a build

# GitHub runs this from main's copy. It checks out nothing and runs only gh. The Actions token
# starts the build, which GitHub allows for workflow_dispatch, and comments. It needs what build.yml
# lists.
on:
  workflow_run:
    workflows: [CI]
    types: [completed]
    branches: ["build/issue-*"]

concurrency:
  group: retry-${{ github.event.workflow_run.head_branch }}
  cancel-in-progress: false

jobs:
  retry:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      actions: write
      issues: write
      pull-requests: read
    steps:
      # Only a pull_request run, which runs once a commit, from a branch of this repository, since a
      # fork's branch can carry a build's name, at the head of the branch's open pull request. A try
      # is a build.yml run for the issue, by its name, since the build label was last added; the
      # fixer's and the rebase's pushes don't count. Nothing is carried from one run to the next.
      - name: Count the builds since the label, and start another or say a person must act
        id: tries
        env:
          GH_TOKEN: ${{ github.token }}
          BRANCH: ${{ github.event.workflow_run.head_branch }}
          HEAD_SHA: ${{ github.event.workflow_run.head_sha }}
          HEAD_REPOSITORY: ${{ github.event.workflow_run.head_repository.full_name }}
          CI_EVENT: ${{ github.event.workflow_run.event }}
          CI_RUN: ${{ github.event.workflow_run.id }}
        run: |
          leave() { echo "$1"; exit 0; }
          [ "$HEAD_REPOSITORY" = "$GITHUB_REPOSITORY" ] && [ "$CI_EVENT" = pull_request ] ||
            leave "CI didn't run on a pull request from a branch of this repository."
          case "$BRANCH" in build/issue-*) issue="${BRANCH#build/issue-}" ;; *) leave "This isn't a build's branch." ;; esac
          case "$issue" in ''|*[!0-9]*) leave "This isn't a build's branch." ;; esac
          [[ "$HEAD_SHA" =~ ^[0-9a-f]{40}$ ]] || leave "CI's commit isn't a commit id."
          case "$CI_RUN" in ''|*[!0-9]*) leave "CI's run isn't a number." ;; esac
          gh api "repos/$GITHUB_REPOSITORY/actions/runs/$CI_RUN/jobs" --paginate --jq '.jobs[]' | jq -s . > "$RUNNER_TEMP/jobs.json"
          jq -e 'any(.[]; .name == "test" and .conclusion == "failure")' "$RUNNER_TEMP/jobs.json" > /dev/null ||
            leave "CI's tests didn't fail."
          pr="$(gh api "repos/$GITHUB_REPOSITORY/pulls?head=$GITHUB_REPOSITORY_OWNER:$BRANCH&base=main&state=open" |
            jq -r --arg repository "$GITHUB_REPOSITORY" --arg branch "$BRANCH" --arg head "$HEAD_SHA" \
              '[.[] | select(.head.ref == $branch and .head.repo.full_name == $repository and .head.sha == $head)]
                | first | .number // empty')"
          [ -n "$pr" ] || leave "No open pull request on $BRANCH is at CI's commit, so a newer CI result decides."

          # shellcheck disable=SC2016 # The query's variables are GraphQL's.
          gh api graphql -F owner="$GITHUB_REPOSITORY_OWNER" -f name="${GITHUB_REPOSITORY#*/}" -F number="$issue" -f query='
            query($owner: String!, $name: String!, $number: Int!) {
              repository(owner: $owner, name: $name) {
                issue(number: $number) {
                  lastEditedAt
                  labels(first: 100) { nodes { name } }
                  timelineItems(itemTypes: [LABELED_EVENT], last: 100) { nodes { ... on LabeledEvent { createdAt label { name } } } }
                }
              }
            }' > "$RUNNER_TEMP/issue.json"
          jq -e '.data.repository.issue.labels.nodes | any(.name == "build")' "$RUNNER_TEMP/issue.json" > /dev/null ||
            leave "The build label is off #$issue, so a person has stopped the build."
          labelled="$(jq -r '[.data.repository.issue.timelineItems.nodes[] | select(.label.name == "build") | .createdAt] | last // empty' "$RUNNER_TEMP/issue.json")"
          [[ "$labelled" =~ ^[0-9]{4}-[0-9]{2}-[0-9]{2}T[0-9:]{8}Z$ ]] || leave "Found no time the build label was added."
          edited="$(jq -r '.data.repository.issue.lastEditedAt // empty' "$RUNNER_TEMP/issue.json")"

          run_url="$GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$CI_RUN"
          if [ -n "$edited" ] && [[ "$edited" > "$labelled" ]]; then
            {
              echo "**CI's tests failed on #$pr, and this issue was edited since the build label was last added, so the build won't try again from it.**"
              echo
              echo "To build it as it reads now, remove the build label and add it again. [CI's run]($run_url)"
            } > "$RUNNER_TEMP/comment.md"
            gh issue comment "$issue" --repo "$GITHUB_REPOSITORY" --body-file "$RUNNER_TEMP/comment.md"
            exit 0
          fi

          builds="$(gh api --paginate "repos/$GITHUB_REPOSITORY/actions/workflows/build.yml/runs?branch=main&created=>=$labelled&per_page=100" |
            jq -s --arg title "Build of issue $issue" \
              '[.[].workflow_runs[] | select(.display_title == $title and .head_branch == "main"
                and (.event | IN("issues", "workflow_dispatch")))] | length')"
          echo "#$issue has had $builds builds since the label was last added."
          if [ "$builds" -lt 3 ]; then
            gh workflow run build.yml --repo "$GITHUB_REPOSITORY" --ref main -f issue="$issue"
            exit 0
          fi
          {
            echo "**CI's tests failed on #$pr, and the build has tried three times since the build label was added, so it has stopped.**"
            echo
            echo "A person must look at it. To start afresh, remove the build label and add it again. [CI's run]($run_url)"
          } > "$RUNNER_TEMP/comment.md"
          gh issue comment "$issue" --repo "$GITHUB_REPOSITORY" --body-file "$RUNNER_TEMP/comment.md"
