# When CI finishes on a pull request with failed tests, an Important review finding, or both,
# one session fixes both on the existing branch in one commit. The end of this CI run's failed
# tests' log is untrusted, read-only data. The opener gate, quiet exits for a moved head or closed
# pull request, two-commit cap, guarded-file offer and referral back all stay. A finding or failing
# test that conflicts with the issue's decisions is referred back; that session changes nothing.
awml: "0.10"
title: A failed pull request is fixed
description: |
  One session fixes failed tests and both reviews' findings, or refers a decision back to the
  build's issue. A fix is one commit, judged by CI, up to two a branch; a referral changes nothing.
scopes:
  - { id: public, label: "public: anyone who reads the repository", processing: any }
parts:
  - { id: failed, kind: trigger, label: "CI finishes on a pull request from a branch of this repository: tests failed, Bug review or Security review failed with something Important, or both", wait: PT1H }
  - { id: token, kind: connector, label: "The repository, through its own Actions token", in: public, ref: chrismdp/issue-to-pull-request#token }
  - { id: app, kind: connector, label: "The repository, through its own GitHub App", in: public, ref: chrismdp/issue-to-pull-request#app }
  - { id: checks, kind: context, label: "The review checks: Bug review, Security review and Classify, with their findings and verdict", in: public, ref: chrismdp/ci-a-commit#checks }
  - { id: branch, kind: context, label: "The pull request's patch against main and its commits, from git", in: public }
  - { id: issue, kind: context, label: "The issue named by build/issue-N, whose thread anyone can write", in: public, untrusted: true }
  - { id: keep, kind: code, op: sort, cleans: true, label: "Run main's shared approval rule: keep a writer's issue or label-approved text, writers' comments, and app comments posted before the label and unedited since", in: public }
  - { id: decisions, kind: context, label: "The approved issue and comments, rendered by GitHub and read-only", in: public }
  - { id: tries, kind: code, op: sort, cleans: true, label: "Check the open pull request, CI's head, fix count and opener's write access or app identity. Past this gate, the patch and findings are trusted people's and models' text; reviews have no Bash, web tools or host access. The tests' log stays untrusted", in: public }
  - { id: bring, kind: code, op: bring-in, label: "Bring in both reviews' findings, the patch and the end of this CI run's failed tests' log as read-only files for one session", in: public }
  - { id: asked, kind: context, label: "The findings and the patch, made read-only", in: public }
  - { id: failedlog, kind: context, label: "The end of this CI run's failed tests' log, failed.log, made read-only: output of the branch's code", in: public, untrusted: true }
  - { id: repo, kind: context, label: "Main's fix prompt, AGENTS.md and REVIEW.md, copied out before the session starts", in: public }
  - { id: weigh, kind: ai, op: sort, label: "For each finding and each failing test: would fixing it, or making it pass, change a decision the maintainer wrote on the issue?", in: public }
  - { id: referred, kind: context, label: "The findings or failing tests referred back, with the decision and options, in referred.md", in: public }
  - { id: ask, kind: code, op: do, cleans: true, label: "Post one new issue comment with an issues-only app token: escape every <, break mentions, cap the text, and print inside stop-commands", in: public }
  - { id: askout, kind: outside, label: "Comment on the build's issue: Allow", in: public }
  - { id: fix, kind: ai, op: draft, label: "In the same session, make failing tests pass and fix every Important finding and Nit, test first, only if none needs referring back", in: public }
  - { id: change, kind: context, label: "The fix, as a patch", in: public }
  - { id: guard, kind: code, op: sort, label: "Leave a moved head or closed pull request quietly. Give up for mixed output, a referral with no build issue or nothing made; otherwise post the referral, push the fix or offer guarded files", in: public }
  - { id: push, kind: code, op: do, label: "Push the fix as one commit carrying the fix line in its message, with --force-with-lease at CI's commit", in: public }
  - { id: standpush, kind: approval, label: "The maintainer's standing approval: one fix commit after failed tests, an Important review finding, or both, on the pull request's own branch, up to two a branch, extended to failed tests in #108 following awml#212", in: public }
  - { id: pushed, kind: outside, label: "Push one commit to the pull request's branch: Ask", in: public }
  - { id: offer, kind: code, op: do, cleans: true, label: "Offer the fix in a new comment from fixed text: gh run download <run> -n fix, the git apply command, and that the artifact lasts 30 days, quoting none of the fix", in: public }
  - { id: offered, kind: outside, label: "Comment on the pull request with the commands: Allow", in: public }
  - { id: listed, kind: surface, label: "The pull request's commits and thread, where each push and comment is listed", in: public }
  - { id: giveup, kind: code, op: do, cleans: true, label: "Say in a new comment, from fixed text, that the failed tests or findings need a person, linking the failed checks and the run", in: public }
  - { id: gaveup, kind: outside, label: "Comment on the pull request: Allow", in: public }
  - { id: count, kind: comment, label: "Its tries are derived, not stored: the fix commits on the branch, counted by the line each one's message carries, which survives a rebase. Someone pushed since means the head isn't the commit that was judged (#160 rule 3)" }
  - { id: quiet, kind: comment, label: "A person's push since CI ran, or a closed pull request, means there is nothing to fix: it exits with no comment. Giving up, offering a fix or referring a decision back posts a comment because a person must act (#160 rule 5)" }
  - { id: nojudge, kind: comment, label: "It pushes and doesn't judge. The push starts CI. A fix that breaks a test wakes this fixer again, as does an Important review finding, within the same two-commit cap. A bad push costs a CI run (#108, awml#212)" }
  - { id: together, kind: comment, label: "Failed tests and Important review findings go to this fixer. When both fail, one session fixes both in one commit on the existing pull request. Failed tests never start a fresh build (#108, awml#212)" }
  - { id: loose, kind: comment, label: "Loosely coupled: it reads CI's checks and failed tests' log, the pull request and the branch from GitHub and git. Builds and landing don't call it or wait for it, so a person's pull request is fixed the same way as a build's" }
  - { id: ownfiles, kind: comment, label: "The app may not change a workflow, and Claude Code's own files, .claude/, .mcp.json or a CLAUDE.md, are never pushed by a session, so a fix touching either is offered for a person: decided in #160's follow-up, the comment carries the gh run download command for the run's fix artifact, not the patch, so nothing is escaped or capped" }
  - { id: steer, kind: comment, label: "The opener gate makes findings and patch trusted people's and models' text. The failed tests' log stays untrusted and can steer the session. Pushes keep their standing approval; referrals escape HTML and mentions" }
  - { id: refer, kind: comment, label: "Only build branches name an issue. If fixing any finding or making a failing test pass changes a decision written there by the maintainer, refer it with its options and change nothing. A test may still hold the behaviour a decision changed. Mixing a fix and referral is refused", in: public }
lines:
  - { from: failed, to: tries, kind: start, label: "CI's run and its commit" }
  - { from: token, to: tries, kind: data, label: "the pull request and its head" }
  - { from: branch, to: tries, kind: data, label: "the branch's commits" }
  - { from: tries, to: keep, kind: start, label: "[open, not moved, fewer than two fix commits]" }
  - { from: issue, to: keep, kind: data }
  - { from: token, to: keep, kind: data, label: "author permissions and label events" }
  - { from: keep, to: decisions, kind: data }
  - { from: keep, to: bring, kind: start }
  - { from: tries, to: giveup, kind: start, label: "[two fix commits]" }
  - { from: checks, to: bring, kind: data, label: "the findings" }
  - { from: branch, to: bring, kind: data, label: "the patch" }
  - { from: token, to: bring, kind: data, label: "the failed test jobs' log from this CI run" }
  - { from: bring, to: asked, kind: data }
  - { from: bring, to: failedlog, kind: data }
  - { from: bring, to: weigh, kind: start }
  - { from: asked, to: weigh, kind: data }
  - { from: failedlog, to: weigh, kind: data, label: "which tests failed" }
  - { from: repo, to: weigh, kind: data }
  - { from: decisions, to: weigh, kind: data }
  - { from: weigh, to: fix, kind: start, label: "[no referral]" }
  - { from: weigh, to: referred, kind: data, label: "findings, decisions and options" }
  - { from: weigh, to: guard, kind: start, label: "[a referral, so nothing changed]" }
  - { from: referred, to: guard, kind: data }
  - { from: asked, to: fix, kind: data }
  - { from: failedlog, to: fix, kind: data, label: "why the tests failed" }
  - { from: repo, to: fix, kind: data }
  - { from: fix, to: change, kind: data }
  - { from: fix, to: guard, kind: start, label: "the fix" }
  - { from: change, to: guard, kind: data }
  - { from: guard, to: push, kind: start, label: "[open, a fix, no guarded files, not moved]" }
  - { from: guard, to: ask, kind: start, label: "[open, a referral, nothing changed, build issue, not moved]" }
  - { from: referred, to: ask, kind: data }
  - { from: ask, to: askout, kind: data }
  - { from: askout, to: app, kind: data }
  - { from: guard, to: giveup, kind: start, label: "[not moved: mixed output, a referral without an issue, or no fix or referral]" }
  - { from: change, to: push, kind: data }
  - { from: push, to: standpush, kind: start }
  - { from: standpush, to: pushed, kind: data, label: "[within limits]" }
  - { from: standpush, to: listed, kind: data, label: "each fix commit, as pushed" }
  - { from: pushed, to: app, kind: data }
  - { from: guard, to: offer, kind: start, label: "[touches .github/ or Claude's files, not moved]" }
  - { from: offer, to: offered, kind: data }
  - { from: offered, to: token, kind: data }
  - { from: fix, to: giveup, kind: start, label: "[gave up]" }
  - { from: giveup, to: gaveup, kind: data }
  - { from: gaveup, to: token, kind: data }
  - { from: count, to: tries, kind: tie }
  - { from: quiet, to: tries, kind: tie }
  - { from: nojudge, to: pushed, kind: tie }
  - { from: loose, to: failed, kind: tie }
  - { from: together, to: failed, kind: tie }
  - { from: ownfiles, to: guard, kind: tie }
  - { from: steer, to: fix, kind: tie }
  - { from: refer, to: weigh, kind: tie }
implementations:
  actions:
    label: "GitHub Actions, fix.yml"
    blocks:
      - { id: github, label: "GitHub: pull requests, checks and comments", parts: [failed, token, app, checks, branch, issue, askout, standpush, pushed, offered, gaveup, listed] }
      - { id: decidejob, label: "Actions job: decide, reading GitHub and git", platform: actions-code, parts: [tries] }
      - { id: fixjob, label: "Actions job: fix, with a token that only reads", platform: actions-code, parts: [keep, decisions, bring, asked, failedlog, repo, referred, change] }
      - { id: agent, label: "Claude Code, claude-opus-5-5, on the maintainer's subscription", platform: actions-agent, in: fixjob, parts: [weigh, fix] }
      - { id: writejob, label: "Actions job: push or comment, running nothing from the change", platform: actions-code, parts: [guard, push, offer, giveup, ask] }
    comments:
      - { id: sandbox, label: "The session runs its commands, tests included, only in its sandbox, keeping the login token from them, loading no settings or servers from the tree. The job runs nothing of its own beside the secret (awml #121, #160)", in: agent, ties: [fix] }
      - { id: reads, label: "Read is limited to the workspace and the session's own input folder, with Read(//proc/**) denied, and Edit is denied on .git/**, which covers every file edit; Claude Code reads no Write deny rule. Git after the session runs with core.hooksPath=/dev/null and core.fsmonitor=false (#160)", in: agent, ties: [fix] }
      - { id: hashed, label: "The fix is an artifact within this run only, because the job split keeps the app's token away from the change's code. The fix job gives its sha256 as an output, the write job checks it, and everything the session wrote is scanned for a token before it's uploaded, pushed or posted. It's uploaded with retention-days: 30, so an offered fix can be downloaded for 30 days (#160 rule 6)", in: writejob, ties: [change] }
