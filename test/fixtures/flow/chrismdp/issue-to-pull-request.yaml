implementations:
  actions:
    label: "GitHub Actions, build.yml"
    blocks:
      - { id: github, label: "GitHub: issues, branches and pull requests", parts: [comment, dispatch, token, app, status, repo, failed, patch, findings, risk, pr, tryfailed, retry, pushed, who] }
      - { id: startjob, label: "Actions job: post the status, running nothing from the issue", platform: actions-code, parts: [started] }
      - { id: draftjob, label: "Actions job: draft, with a read-only token", platform: actions-code, parts: [bring] }
      - { id: agentjob, label: "Claude Code, claude-opus-5-5, on the maintainer's subscription", platform: actions-agent, in: draftjob, parts: [build] }
      - { id: checkjob, label: "Actions job: checks, with a read-only token", platform: actions-code, parts: [gate] }
      - { id: reviewjob, label: "Actions job: review and classify, with a read-only token", platform: actions-code, parts: [weigh] }
      - { id: reviewagent, label: "Claude Code, claude-opus-5-5, a fresh session for each review and the classifier", platform: actions-agent, in: reviewjob, parts: [review, secreview, classify] }
      - { id: openjob, label: "Actions job: push and open, running nothing from the change", platform: actions-code, parts: [open] }
    comments:
      - { id: scrub, label: "Claude Code holds the maintainer's login token for its own calls, and strips it, with any other credential, from the commands it runs, so text that steers Claude can't send it anywhere. A command running as the same user could still read Claude Code's own environment (awml #121)", in: agentjob, ties: [build] }
      - { id: scrubreview, label: "The same here: each session keeps the login token from the commands it runs (awml #121)", in: reviewagent, ties: [review, secreview, classify] }
