awml: "0.10"
title: Broken bread
description: |
  A workflow with mistakes that make it invalid, and no warnings: a line to a part that isn't there, and
  a part its implementation doesn't place.
scopes:
  - { id: bakery, label: "Bakery", processing: any }
parts:
  - { id: morning, kind: trigger, label: "Morning", wait: PT1H }
  - { id: plan, kind: ai, label: "Plan", in: bakery }
  - { id: notes, kind: context, label: "Notes", in: bakery }
lines:
  - { from: morning, to: plan, kind: start }
  - { from: plan, to: missing, kind: data }
  - { from: plan, to: notes, kind: data }
implementations:
  home:
    label: At home
    blocks:
      - { id: server, label: "Server", parts: [plan] }
